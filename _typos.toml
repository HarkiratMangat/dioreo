# `mis` is flagged as a misspelling of "miss"/"mist", but this repo uses it constantly as a valid
# hyphenated prefix — mis-described, mis-filed, mis-indexed. Measured 2026-08-02 15:25 EDT: it was the
# single largest false-positive source, and a linter that is usually wrong is one you learn to ignore.
[default.extend-words]
mis = "mis"
unparseable = "unparseable"
# `cpy` is the copy-control class family in scripts/buildLegalPages.js — .cpy, .cpy-t, .cpy-s and
# the CSS-drawn .cpy-g glyph, 30 occurrences. typos reads it as "copy"/"cpu". Flagged 2026-08-02
# 23:21 EDT while writing a handoff that named the class. Same reasoning as `mis` above: the
# checker is right about English and wrong about this repo, and a linter that is wrong about your
# own vocabulary is one you stop reading.
cpy = "cpy"

# Hook self-tests carry DELIBERATE misspellings as fixtures — typos-check.test.sh has to feed the
# checker a real typo to prove it still fires. Without this exclusion the spellchecker reports the
# test that proves the spellchecker works, which is noise of exactly the kind the `mis` note above
# describes. Added 2026-08-02 16:49 EDT, when writing that test tripped the hook it was testing.
[files]
extend-exclude = [".claude/hooks/*.test.sh"]
