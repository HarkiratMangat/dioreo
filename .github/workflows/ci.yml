name: CI

# Deliberately minimal: this repo has no test framework (no Jest/Mocha, no ESLint config) as of
# 2026-07-25, so inventing style/test infra here would be scope creep. What this DOES automate is
# the one check that was already happening manually before every commit -- `node --check` across
# every JS file -- plus basic install sanity and a non-blocking dependency audit. Expand this
# workflow (real tests, linting) only once those tools actually exist in the project.
# `v3-pre-release` is listed alongside `main` deliberately: under the v3 development structure
# (docs/superpowers/specs/2026-07-27-v3-development-structure-design.md) every v3 feature PR targets
# `v3-pre-release`, not `main`. With `main` alone here, none of that work would run CI at all -- and the
# failure is silent, since a repo with no runs looks the same as a repo whose runs all pass. Any future
# long-lived integration branch needs adding to BOTH lists for the same reason.
on:
  push:
    branches: [main, v3-pre-release]
  pull_request:
    branches: [main, v3-pre-release]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED by scripts/docs-audit.mjs, not a preference. The default depth-1
      # checkout has no tags and no history, which breaks the audit in both directions: `hash-chain`
      # would report every changelog commit hash as unresolvable (CI fails on correct docs), and
      # `tag-integrity` would iterate an empty tag list and pass silently (CI green on broken tags).
      # A check that cannot see its own inputs is worse than no check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check

      # The documentation invariants (scripts/docs-audit.mjs). This step is the whole reason the audit
      # is a program instead of another Claude Code hook: a hook only fires inside a Claude session on
      # one Mac, so a PR opened by anyone else -- or a session where the hook silently errored -- was
      # completely unchecked. Here it runs on every PR, forever.
      #
      # Its own self-test runs FIRST and gates the audit: an audit whose checks have quietly stopped
      # matching passes everything, which is indistinguishable from a clean tree. That is not
      # hypothetical -- usage-guard.mjs shipped with every Bash rule dead from line 2 and looked fine.
      - run: npm run docs:audit:test
      - run: npm run docs:audit

      # ⚠️ public/ IS BUILD OUTPUT AND IT IS COMMITTED, so it can be committed STALE. Editing any of
      # the nine sources (docs/legal/*.md, LICENSE, NOTICE, CONTRIBUTING.md, CONTRIBUTORS.md, and the
      # three records) and forgetting to rebuild leaves the deployed site showing the previous text —
      # including, for the four legal instruments, the previous binding wording. Until 2026-08-02 the
      # only thing preventing that was a prose instruction in CLAUDE.md to remember to run the build.
      #
      # The build is DETERMINISTIC — verified by running it twice and hashing the tree, byte-identical
      # both times, with git reporting no change — so rebuilding and asking git whether anything moved
      # is an exact test, not an approximation. If this step fails, the fix is to run the build and
      # commit the result; never to edit public/ by hand.
      # Emoji ids are captured at RENDER time, never at require time — a module-level const holding
      # `${emojis.x}` freezes whatever id was loaded when the module was first required, which is the
      # PROD id, and then the dev bot renders broken emoji. Memory project_emoji_require_time_capture
      # says to run this after touching emoji rendering; that was a prose instruction and nothing ran
      # it. Verified to exit 0 on a clean tree before wiring it here.
      - run: node scripts/checkEmojiCaptures.js

      - run: npm run site
      - name: public/ is up to date with its sources
        run: |
          # ⚠️ public/changelog/ IS EXCLUDED ON PURPOSE (2026-08-02 02:45 EDT, Harkirat's call).
          # Those three pages are withdrawn from the nav and reachable by nobody, and the deploy
          # workflow already skips them — so ALSO forcing a rebuild+commit of their HTML on every
          # changelog or devlog edit was pure churn for output that is never served to a reader.
          # They are allowed to drift, deliberately, and get one bulk resync when those pages are
          # revived. `chronicle-drift` (WARN) keeps that drift visible in the meantime.
          if ! git diff --quiet -- public/ ':(exclude)public/changelog/'; then
            echo "::error::public/ is stale — a source was edited without rebuilding the site."
            git diff --stat -- public/ ':(exclude)public/changelog/'
            exit 1
          fi

      # Advisory only -- known, already-tracked findings (discord.js/undici/xlsx, see
      # docs/ROADMAP.md's housekeeping notes) shouldn't fail every build; this just keeps them
      # visible in the CI log rather than silently ignored.
      - run: npm audit --audit-level=high
        continue-on-error: true
