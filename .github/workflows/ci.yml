name: CI

# Deliberately minimal: this repo has no test framework (no Jest/Mocha, no ESLint config) as of
# 2026-07-25, so inventing style/test infra here would be scope creep. What this DOES automate is
# the one check that was already happening manually before every commit -- `node --check` across
# every JS file -- plus basic install sanity and a non-blocking dependency audit. Expand this
# workflow (real tests, linting) only once those tools actually exist in the project.
# `v3-pre-release` is listed alongside `main` deliberately: under the v3 development structure
# (docs/superpowers/specs/2026-07-27-v3-development-structure-design.md) every v3 feature PR targets
# `v3-pre-release`, not `main`. With `main` alone here, none of that work would run CI at all -- and the
# failure is silent, since a repo with no runs looks the same as a repo whose runs all pass. Any future
# long-lived integration branch needs adding to BOTH lists for the same reason.
on:
  push:
    branches: [main, v3-pre-release]
  pull_request:
    branches: [main, v3-pre-release]

# No step here pushes, comments, or otherwise writes with GITHUB_TOKEN — checkout,
# npm ci, and local checks only — so the default (broad, write-capable) token
# permissions are strictly more than this workflow needs. Scoped down per
# CodeQL's actions/missing-workflow-permissions finding.
permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    # CLAUDE_PROJECT_DIR is normally set by the Claude Code harness itself, so every hook script's
    # fallback (`${CLAUDE_PROJECT_DIR:-/Applications/Claude Code/Diors-Builds}`) exists purely for a
    # bare `bash <hook>` on Harkirat's own Mac -- it was never meant to be load-bearing here. CI has
    # no harness and never set it, so every one of those fallbacks silently resolved to a path that
    # does not exist on this runner. Found real: self-check.test.sh's marker test (`touch` on the
    # fallback path) and its settings.json-registration check (`open()` on the fallback path) both
    # failed outright the first time CI actually reached them -- earlier runs never got this far,
    # since npm test's own `&&` chain stopped at an unrelated failure first. Setting this once, job-
    # wide, makes every hardcoded fallback in the tree resolve correctly here instead of finding and
    # patching each script's fallback path individually.
    env:
      CLAUDE_PROJECT_DIR: ${{ github.workspace }}
    steps:
      # fetch-depth: 0 is REQUIRED by scripts/docs-audit.mjs, not a preference. The default depth-1
      # checkout has no tags and no history, which breaks the audit in both directions: `hash-chain`
      # would report every changelog commit hash as unresolvable (CI fails on correct docs), and
      # `tag-integrity` would iterate an empty tag list and pass silently (CI green on broken tags).
      # A check that cannot see its own inputs is worse than no check.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci

      # ripgrep is a real dependency of `.claude/hooks/stale-reference-sweep.sh` — the whole sweep is
      # one `rg` call. The runner does not ship it, and without it the hook found nothing and exited
      # silently, so all five of its assertions passed as SILENT on the first CI run after the
      # required status check was enabled. The hook now reports its own absence, but installing rg is
      # what makes CI test the REAL path instead of the degraded one.
      - run: sudo apt-get install -y ripgrep

      # `npm test` rather than `npm run check`, changed 2026-08-02 16:49 EDT. Two suites existed and
      # NOTHING RAN THEM in CI: `scripts/calendarDedup.test.js` (reachable only via `npm test`, which
      # CI never called) and the ten `.claude/hooks/*.test.sh` files, which were referenced by
      # package.json, this workflow and settings.json a combined ZERO times — they ran only when
      # someone hand-typed `bash <file>`. Harkirat, 2026-08-02: "i literally spent hours last session
      # working on some of these gates and ... they dont even seem to hold despite their 'tests'."
      # The tests were fine. Nothing was running them. A test nobody runs is worse than no test,
      # because it produces a documented belief that the behaviour is covered.
      #
      # This covers `npm run check` (node --check over every JS file) and `docs:audit:test`, so
      # neither needs its own step any more.
      - run: npm test

      # The documentation invariants (scripts/docs-audit.mjs). This step is the whole reason the audit
      # is a program instead of another Claude Code hook: a hook only fires inside a Claude session on
      # one Mac, so a PR opened by anyone else -- or a session where the hook silently errored -- was
      # completely unchecked. Here it runs on every PR, forever.
      #
      # Its own self-test runs FIRST and gates the audit: an audit whose checks have quietly stopped
      # matching passes everything, which is indistinguishable from a clean tree. That is not
      # hypothetical -- usage-guard.mjs shipped with every Bash rule dead from line 2 and looked fine.
      # ⚠️ KEPT EXPLICIT even though `npm test` above already runs it. Removing this line tripped
      # docs-audit's own `ci-wiring` check, which asserts CI runs the audit's self-test by NAME —
      # and that check is right to be literal: if `npm test` is ever re-scoped, the self-test would
      # vanish from CI silently, and an audit whose checks have quietly died passes everything.
      # A couple of duplicated seconds is the correct price for that invariant staying checkable.
      - run: npm run docs:audit:test
      - run: npm run docs:audit

      # ⚠️ public/ IS BUILD OUTPUT AND IT IS COMMITTED, so it can be committed STALE. Editing any of
      # the nine sources (docs/legal/*.md, LICENSE, NOTICE, CONTRIBUTING.md, CONTRIBUTORS.md, and the
      # three records) and forgetting to rebuild leaves the deployed site showing the previous text —
      # including, for the four legal instruments, the previous binding wording. Until 2026-08-02 the
      # only thing preventing that was a prose instruction in CLAUDE.md to remember to run the build.
      #
      # The build is DETERMINISTIC — verified by running it twice and hashing the tree, byte-identical
      # both times, with git reporting no change — so rebuilding and asking git whether anything moved
      # is an exact test, not an approximation. If this step fails, the fix is to run the build and
      # commit the result; never to edit public/ by hand.
      # Emoji ids are captured at RENDER time, never at require time — a module-level const holding
      # `${emojis.x}` freezes whatever id was loaded when the module was first required, which is the
      # PROD id, and then the dev bot renders broken emoji. Memory project_emoji_require_time_capture
      # says to run this after touching emoji rendering; that was a prose instruction and nothing ran
      # it. Verified to exit 0 on a clean tree before wiring it here.
      - run: node scripts/checkEmojiCaptures.js

      - run: npm run site
      - name: public/ is up to date with its sources
        run: |
          # ⚠️ public/changelog/ IS EXCLUDED ON PURPOSE (2026-08-02 02:45 EDT, Harkirat's call).
          # Those three pages are withdrawn from the nav and reachable by nobody, and the deploy
          # workflow already skips them — so ALSO forcing a rebuild+commit of their HTML on every
          # changelog or devlog edit was pure churn for output that is never served to a reader.
          # They are allowed to drift, deliberately, and get one bulk resync when those pages are
          # revived. `chronicle-drift` (WARN) keeps that drift visible in the meantime.
          if ! git diff --quiet -- public/ ':(exclude)public/changelog/'; then
            echo "::error::public/ is stale — a source was edited without rebuilding the site."
            git diff --stat -- public/ ':(exclude)public/changelog/'
            exit 1
          fi

      # ── Dependency audit, split by what actually SHIPS (restructured 2026-08-08 13:05 EDT) ────────
      # It used to be one dev-inclusive `npm audit` marked continue-on-error. That was honest but it
      # printed a red "Process completed with exit code 1" on EVERY run, for a finding that cannot
      # reach production — and a permanent red line in a green build is how a real one gets read past.
      #
      # The split is not a suppression, it is the correct question asked twice:
      #   · PRODUCTION tree — what the VM installs (`npm install --omit=dev`). Must be clean. BLOCKING.
      #   · DEV tree — visible, never failing, because its one high finding is unfixable by us.
      #
      # The dev finding is `xlsx` (SheetJS prototype pollution + ReDoS). npm reports "No fix
      # available" because SheetJS left the npm registry; the patched builds live on their own CDN.
      # It is a devDependency (moved there 2026-07-26 19:19 EDT) whose ONLY consumer is
      # scripts/migrateBuildsToMongo.js, a one-off local migration run against a file Harkirat
      # authored. Verified 2026-08-08 13:05 EDT: `npm audit --omit=dev` reports 0 vulnerabilities, so
      # nothing reachable from the running bot is affected. Tracked in memory
      # `project_dependabot_vulnerabilities_deferred`.
      - name: Dependency audit — production tree (blocking)
        run: npm audit --audit-level=high --omit=dev

      - name: Dependency audit — dev tree (advisory, never blocks)
        run: |
          npm audit --audit-level=high || \
            echo "::notice::Advisory only. Dev-tree findings are absent from the production install \
          (--omit=dev is clean, asserted by the blocking step above). Currently: xlsx/SheetJS, no fix \
          published on npm. See memory project_dependabot_vulnerabilities_deferred."
