.b3-tri button{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:var(--rad-box);background:none;color:var(--ink3);cursor:pointer}
.b3-tri button:hover{background:var(--hi);color:var(--ink)}

/* ═══ P6 · repairs ═══ */

  background:color-mix(in srgb,var(--warn) 8%,var(--sunk));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 36%,transparent)}
.b3-mstat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(-45deg,var(--warn) 0 3px,transparent 3px 6px)}
.b3-mstat b{grid-row:span 2;font:600 var(--t-figure)/1 var(--display);color:var(--warn-ink)}
.b3-mstat span{font:600 var(--t-sm)/1.2 var(--ui);color:var(--ink)}

.b3-work{border-radius:var(--rad-3);background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule2);overflow:hidden}

.b3-wr .w b{font:600 var(--t-base)/1 var(--ui);color:var(--ink)}

.b3-check{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:var(--rad-pill);font:500 var(--t-sm)/1 var(--ui);color:var(--ink2);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule)}

/* ═══ P7 · command search ═══ */
.b3-cmd{width:560px;max-width:100%;margin:0 auto;border-radius:var(--rad-3);background:var(--raised);box-shadow:inset 0 0 0 1px var(--rule2),0 28px 60px -20px var(--scrim-80);overflow:hidden}
.b3-cmdin{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-bottom:1px solid var(--rule);font:500 var(--t-md)/1 var(--ui);color:var(--ink)}
.b3-cmdin .ic{color:var(--ink3)}
.b3-cmdin .caret{width:1.5px;height:18px;background:var(--focus);margin-left:-8px}
.b3-cmdin kbd{margin-left:auto;font:600 11px/1 var(--data);color:var(--ink3);padding:4px 6px;border-radius:var(--rad-1);box-shadow:inset 0 0 0 1px var(--rule2)}
.b3-cmdl{padding:6px 8px 8px}

.b3-cmdr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:46px;padding:0 10px;border-radius:var(--rad-box)}

.b3-cmdr div b mark{background:none;color:var(--c,var(--focus));text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.b3-cmdr div small{font:500 var(--t-sm)/1.2 var(--ui);color:var(--ink3)}
.b3-cmdr div small mark{background:none;color:var(--ink2)}
.b3-cmdr > em{font:600 var(--t-micro)/1 var(--data);letter-spacing:.12em;text-transform:uppercase;font-style:normal;color:var(--c,var(--ink3));padding:5px 7px;border-radius:var(--rad-1);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--ink3)) 40%,transparent)}
.b3-cmdf{display:flex;align-items:center;gap:14px;padding:10px 16px;border-top:1px solid var(--rule);font:500 var(--t-xs)/1 var(--ui);color:var(--ink3)}
.b3-cmdf kbd{font:600 10.5px/1 var(--data);color:var(--ink2);padding:3px 5px;margin-right:5px;border-radius:var(--rad-1);box-shadow:inset 0 0 0 1px var(--rule2)}
.b3-compose{display:grid;gap:12px;margin:8px;padding:14px;border-radius:var(--rad-box);background:var(--sunk);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--r-review) 38%,transparent)}
.b3-compose .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.b3-tok{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:var(--rad-box);font:600 var(--t-sm)/1 var(--ui);color:var(--ink);background:var(--raised);box-shadow:inset 0 0 0 1px var(--rule2);white-space:nowrap}
.b3-tok .ic{width:14px;height:14px;color:var(--ink3)}
.b3-tok.verb{color:var(--on-staged);background:var(--r-review);box-shadow:none}

.b3-tok.weap i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.b3-tok.weap em{font:500 var(--t-sm)/1 var(--data);font-style:normal;color:var(--ink3)}
.b3-joiner{font:500 var(--t-sm)/1 var(--ui);color:var(--ink3)}

.b3-map{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.b3-map th{text-align:left;padding:10px 12px;font:600 var(--t-micro)/1 var(--data);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);background:var(--sunk)}
.b3-map td{padding:10px 12px;border-top:1px solid var(--rule3);vertical-align:top;color:var(--ink2);line-height:1.45}
.b3-map td:first-child{font:600 var(--t-sm)/1.45 var(--data);color:var(--ink);white-space:nowrap}
.b3-map td b{color:var(--ink);font-weight:600}

/* ═══ P8 · heads up ═══ */
.b3-warnbar{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:16px;padding:14px 14px 14px 26px;border-radius:var(--rad-3);overflow:hidden;
  background:color-mix(in srgb,var(--warn) 7%,var(--paper));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 36%,transparent)}
.b3-warnbar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(-45deg,var(--warn) 0 3px,transparent 3px 6px)}

.b3-warnbar .t{display:grid;gap:8px;min-width:0}

  background:color-mix(in srgb,var(--warn) 10%,var(--sunk));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 36%,transparent);font:600 var(--t-sm)/1 var(--ui);color:var(--warn-ink)}
.b3-cardwarn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:repeating-linear-gradient(-45deg,var(--warn) 0 3px,transparent 3px 6px)}

.b3-attn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(-45deg,var(--warn) 0 3px,transparent 3px 6px)}
.b3-attn b{font:700 var(--t-sm)/1 var(--data);color:var(--ink)}
.b3-attn .ic{width:14px;height:14px}

/* ═══ P9 · history ═══ */
.b3-hist{border-radius:var(--rad-3);background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule2);overflow:hidden}
.b3-htools{display:grid;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.b3-htools .r1{display:flex;align-items:center;gap:12px}
.b3-htools .r1 > b{font:600 var(--t-md)/1 var(--ui);color:var(--ink);min-width:84px}
.b3-hsearch{display:flex;align-items:center;gap:10px;width:320px;height:40px;padding:0 12px;border-radius:var(--rad-box);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule2);font:500 var(--t-base)/1 var(--ui);color:var(--ink3)}

.b3-fc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:var(--rad-pill);cursor:pointer;font:600 var(--t-sm)/1 var(--ui);color:var(--ink2);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule2);white-space:nowrap}

.b3-fc em{font:500 var(--t-xs)/1 var(--data);font-style:normal;color:var(--ink3)}
.b3-fc .av{width:18px;height:18px;margin-left:-4px}
.b3-hh,.b3-hr{display:grid;grid-template-columns:40px 118px 118px minmax(0,1fr) 150px 44px;align-items:center;column-gap:12px;padding:0 12px 0 16px}

.b3-hr .what{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0;font:500 var(--t-base)/1.35 var(--ui);color:var(--ink)}
.b3-ent{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--rad-1);font:500 var(--t-sm)/1 var(--ui);color:var(--ink);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule)}

.b3-meter i:nth-child(1){height:5px}.b3-meter i:nth-child(2){height:7px}.b3-meter i:nth-child(3){height:10px}.b3-meter i:nth-child(4){height:12px}

.b3-day{position:relative;display:flex;align-items:center;gap:12px;min-height:40px;padding:0 16px;background:var(--desk);border-top:1px solid var(--rule);font:600 var(--t-sm)/1 var(--ui);color:var(--ink)}
.b3-day em{font:500 var(--t-sm)/1 var(--data);font-style:normal;color:var(--ink3)}
.b3-day::after{content:"";flex:1;height:1px;background:var(--rule3)}
.b3-hist.tl .b3-hh,.b3-hist.tl .b3-hr{grid-template-columns:40px 72px 118px minmax(0,1fr) 150px 44px}

/* ═══ E1 · buttons ═══ */
.b3-btt{display:grid;grid-template-columns:132px repeat(6,minmax(0,1fr));align-items:center;border-radius:var(--rad-3);background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule2);overflow:hidden}

.b3-btt > .h{min-height:40px;border-top:0;background:var(--sunk);font:600 var(--t-micro)/1 var(--data);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.b3-btt > .r{justify-content:flex-start;padding-left:18px;font:600 var(--t-sm)/1.3 var(--ui);color:var(--ink)}
.b3-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:var(--rad-pill);cursor:pointer;white-space:nowrap;font:600 var(--t-base)/1 var(--ui);transition:background var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease),transform var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}

.b3-btn.create.hov{background:color-mix(in srgb,#fff 16%,var(--r-review))}

.b3-btn.second.prs{background:var(--raised)}

.b3-btn.ghost.hov{color:var(--ink);background:var(--hi)}
.b3-btn.ghost.prs{background:var(--raised)}
.b3-btn.danger{color:var(--danger-ink);background:transparent;box-shadow:inset 0 0 0 1px var(--danger-edge)}
.b3-btn.danger.hov{color:var(--ink);background:color-mix(in srgb,var(--danger-ink) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger-ink) 50%,transparent)}

.b3-btn.b3-tile{padding:0 16px 0 5px;color:var(--ink);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule2)}
.b3-btn.b3-tile > i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--on-staged);background:var(--r-review)}

.b3-btn.b3-tile.sm > i{width:26px;height:26px}
.b3-btn.b3-tile.hov{background:var(--hi);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--r-review) 55%,transparent)}
.b3-btn.b3-tile.prs{background:var(--raised)}
.b3-inplace{display:grid;gap:14px}
.b3-inrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 16px;border-radius:var(--rad-box);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule3)}
.b3-inrow > span{font:600 var(--t-micro)/1 var(--data);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);min-width:150px}

/* ═══ E2 · icon buttons ═══ */

    <div class="b3-e6row"><span>An explanation</span><div>${histPh}</div></div></div>`;
  const e6 = (mode) => `<div class="b3-e6">
    <div class="b3-e6row"><span>A count on a control<small>the words stay Session 4’s</small></span><div><span class="b3-segx"><span class="on">Tier board <span class="b3-count${mode === 'a' ? ' a' : ''}">64/125</span></span><span>Repairs <span class="b3-count${mode === 'a' ? ' a' : ''}">5</span></span><span>Compare</span></span></div></div>
    <div class="b3-e6row"><span>The state of a list</span><div>${mode === 'a' ? `<span class="b3-meta">${ic('layers')}<b>7</b> categories</span><span class="b3-meta"><b>125</b> builds</span><span class="b3-meta">${ic('chevrons-down-up')}all closed</span>` : `<span class="b3-rail2"><span><b>7</b> categories</span><span><b>125</b> builds</span><span>all closed</span></span>`}</div></div>
    <div class="b3-e6row"><span>A fact about the realm</span><div>${mode === 'a' ? `<span class="b3-meta"><b>133</b> builds</span><span class="b3-meta">${ic('download')}<b>4</b> formats</span>` : `<span class="b3-rail2"><span><b>133</b> builds</span><span><b>4</b> formats</span></span>`}</div></div>
    <div class="b3-e6row"><span>A limit</span><div>${mode === 'a' ? `<span class="b3-meta">${ic('layers')}<b>1</b> of 10 slots used</span>` : `<span class="b3-rail2"><span><b>1</b> of 10 slots used</span></span>`}</div></div>
    <div class="b3-e6row"><span>A field’s own result</span><div style="flex:1"><div class="b3-field" style="flex:1"><p>SESSIONB-SEED Season 7 is live — Reckoning drops today: new draws, a reworked ranked reset…</p><div class="foot">${mode === 'a' ? `<span class="b3-meta">${ic('text')}<b>126</b> characters</span>` : `<span class="b3-rail2"><span><b>126</b> characters</span></span>`}<button class="b3-btn ghost sm">${ic('chevron-down')}Show all</button></div></div></div></div>
    <div class="b3-e6row expl"><span>An explanation</span><div><span style="font:700 var(--t-micro)/1 var(--data);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)">Events</span><button class="b3-info hov" aria-label="About this list">${ic('info')}</button><div class="b3-ipop" style="left:0;top:44px"><b>One history, both front doors</b>Alerts, changes and restarts are all events here; filter the one stream instead of switching views.</div></div></div>
    </div>`;
  add('e6', 'review', 'E6 Small text', `
    ${head('E6', 'Small text: what each kind looks like', ['pmu2wfo7w', 'pmu2whbom', 'pmu2wtq39', 'pmu2x71th', 'pmu2zg5ym', 'pmu2xowwq'])}
    ${frame('Now', 'Six kinds of small text, as shipped', e6now, '12 small-text looks measured; the words are Session 4’s to rewrite')}
    <div class="b3-grid two">
      ${frame('A', 'Meta chips: each fact in a soft container with an icon', e6('a'))}
      ${frame('B', 'Data rail: facts as mono values on a faint rail', e6('b'))}
    </div>
    ${spec([['A count', 'always a small badge on the control it counts, never loose text after a label'], ['A fact', 'mono, with its number in ink so the eye lands on the value; A gives each a soft container, B lines them on one rail'], ['A field’s result', 'inside the field, on its footer, above a dashed divider'], ['An explanation', 'never on the page: an info button beside the panel title opens it, so a reader who knows the page is never slowed'], ['Words', 'these designs keep today’s strings on purpose; Session 4 rewrites or deletes them with the design you pick here']])}`);

  // ───────────── render ─────────────
  const REALM = { armory: 'var(--r-armory)', broadcast: 'var(--r-broadcast)', history: 'var(--r-history)', review: 'var(--r-review)', shell: 'var(--ink2)' };
  document.getElementById('sections').outerHTML = sections.map((s) => `<section class="b3-s app" id="${s.id}" data-realm="${s.realm === 'shell' ? 'home' : s.realm}">${s.html}</section>`).join('');
  const nav = document.getElementById('nav');
  sections.forEach((s, i) => { if (i === 9) nav.insertAdjacentHTML('beforeend', '<span class="b3-sep"></span>'); nav.insertAdjacentHTML('beforeend', `<a href="#${s.id}" style="--c:${REALM[s.realm]}"><i></i>${s.navLabel}</a>`); });
  const alignPops = () => document.querySelectorAll('.b3-popwrap').forEach((w) => {
    const scope = w.closest('.b3-vp, .b3-st'); const chip = scope && scope.querySelector('.b3-wchip[aria-expanded="true"]'); const card = w.querySelector('.b3-pop');
    if (!chip || !card) return;
    w.style.paddingRight = '0px';
    const cr = chip.getBoundingClientRect(), wr = w.getBoundingClientRect();
    w.style.paddingRight = Math.max(0, Math.round(wr.right - cr.right)) + 'px';
    card.style.setProperty('--nx', Math.round(cr.width / 2 - 6) + 'px');
  });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(alignPops); addEventListener('resize', alignPops);
})();
</script>
