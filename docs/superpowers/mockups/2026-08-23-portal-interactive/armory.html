            </div>
            <label class="dwfield"><span>Gunsmith code${draft.mode === 'DMZ'
              ? ' <i>DMZ has no code — the card omits it</i>' : ' <i>10 chars, digit/letter alternating</i>'}</span>
              <span class="bed-code"><input id="eS" value="${draft.shareCode}" ${draft.mode === 'DMZ' ? 'disabled' : ''}
                placeholder="1C2B4A8B9A" spellcheck="false">
                <button class="chip" id="eCopy" ${draft.shareCode ? '' : 'disabled'}>Copy</button></span></label>
            <label class="dwfield"><span>Description <i>renders as a blockquote above the attachments</i></span>
              <input id="eD" value="${draft.description}" placeholder="No suppressor build… FMJ allows 1 tap through walls."></label>
          </div>

          <div class="bed-sec">
            <h5>Attachments <em>${draft.attachments.length}</em></h5>
            <ul class="attlist" id="attList">
              ${draft.attachments.map((a, i) => `
                <li class="attrow" data-i="${i}">
                  <span class="attn">${i + 1}</span>
                  <input class="atti" value="${a.replace(/"/g, '&quot;')}" data-att="${i}">
                  <input class="atts" value="${draft.attachmentSlots[i] || ''}" data-slot="${i}"
                         placeholder="slot (optional)">
                  <button class="attx" data-del="${i}" aria-label="Remove ${a}">&#10005;</button>
                </li>`).join('')}
            </ul>
            <div class="attfoot">
              <button class="chip" id="attAdd">+ Add attachment</button>
              <span class="attnote">${draft.attachments.length === 5
                ? 'Five, the usual count — 123 of 133 builds carry exactly this many.'
                : draft.attachments.length + ' attachments. Legal, and sometimes right, but unusual — most builds carry 5.'}
                Slot labels are only ever filled by <code>/autobuild</code>'s vision pass; zero stored builds have them.</span>
            </div>
          </div>

          <div class="bed-sec">
            <h5>Badges</h5>
            <div class="badgerow">
              <button class="bgt ${draft.isMeta ? 'on' : ''}" data-bg="meta">Meta</button>
              <button class="bgt tox ${draft.isToxic ? 'on' : ''}" data-bg="toxic">Toxic</button>
            </div>
            ${draft.mode === 'MP' ? `
              <div class="badgerow">
                ${['best', 'top3', 'top4', 'top5'].map(r => `<button class="bgt rank ${draft.categoryRank === r ? 'on' : ''}"
                   data-rank="${r}">${F.RANK_LABEL[r]}</button>`).join('')}
                <button class="bgt rank ${!draft.categoryRank ? 'on' : ''}" data-rank="">Unranked</button>
              </div>`
            : `<div class="badgerow">
                ${F.DMZ_RANGE_TOKENS.map(r => `<button class="bgt rank ${draft.dmzRangeRank === r ? 'on' : ''}"
                   data-dmz="${r}">${r.replace('-', ' · ')}</button>`).join('')}
                <button class="bgt rank ${!draft.dmzRangeRank ? 'on' : ''}" data-dmz="">None</button>
              </div>`}
            <p class="bgnote">🔴 <b>Badges describe the weapon, not this build.</b> Changing one here
              propagates to <b>all ${sibs.length}</b> ${draft.weaponName} ${draft.mode} build${sibs.length === 1 ? '' : 's'},
              exactly as <code>handlers/manage.js</code>'s edit handler does. <code>best</code> and
              <code>top{N}</code> are one ranking, so picking either replaces the other; Meta and Toxic
              are independent flags.</p>
          </div>
        </div>

        <aside class="bed-side">
          <div class="bed-sec">
            <h5>Image</h5>
            <div class="imgbox ${draft.imageKey ? '' : 'none'}">
              ${draft.imageKey
                ? `<img src="${F.imageUrl(draft.imageKey)}" alt="${draft.weaponName}"
                     onerror="this.closest('.imgbox').classList.add('failed')">
                   <span class="imgfail">Cloudinary returned nothing for this key.</span>`
                : `<span class="imgnone">No image — the card omits the gallery entirely</span>`}
            </div>
            <label class="dwfield"><span>imageKey <i>Cloudinary key, or a full URL</i></span>
              <input id="eI" value="${draft.imageKey}" placeholder="AK117-1" spellcheck="false"></label>
            <div class="imgact">
              <button class="chip" id="imgSuggest">Use convention</button>
              <a class="chip" id="imgOpen" target="_blank" rel="noopener"
                 href="${draft.imageKey ? F.imageUrl(draft.imageKey) : '#'}">Open asset &#8599;</a>
              <button class="chip danger" id="imgClear" ${draft.imageKey ? '' : 'disabled'}>Remove</button>
            </div>
            <p class="imgnote">Convention is <code>WEAPON-N</code> — all caps, spaces to hyphens,
              N being this build's position among its siblings. Delivery goes through
              <code>f_auto,q_auto</code>, so the bot never serves an unoptimised original.</p>
          </div>
          <div class="bed-sec">
            <h5>What Discord sends</h5>
            <div id="edPrev"></div>
          </div>
        </aside>
      </div>
      ${def.length ? `<div class="dwissues"><h6>${def.length} issue${def.length > 1 ? 's' : ''} on this build</h6>
        ${def.map(d => `<div class="dwissue"><b>${d.label}</b><span>${d.why}</span></div>`).join('')}</div>`
        : `<div class="dwissue ok"><b>No issues on this build.</b><span>Every check in Repairs passes for this row.</span></div>`}`;

    S.drawer({
      eyebrow:`loadouts.edit · tier 1 · ${draft.category} · ${draft.mode}`,
      title:`${draft.weaponName} — ${draft.buildName}`, wide:true, body:render(),
      actions:`<button class="btn" id="eCancel">Cancel</button>
               <button class="btn dang" id="eDel">Delete build…</button>
               <button class="btn go" id="eSave">Stage changes</button>`
    });
    wireEditor();

    function repaint() {
      const d = document.querySelector('.drawer .dw-b');
      const sc = d.scrollTop;
      d.innerHTML = render(); wireEditor(); d.scrollTop = sc;
    }
    function preview() {
      const el = document.getElementById('edPrev');
      if (el) el.innerHTML = loadoutCard(draft);
    }
    function wireEditor() {
      preview();
      const on = (id, ev, fn) => { const e = document.getElementById(id); if (e) e.addEventListener(ev, fn); };
      on('eW', 'input', e => { draft.weaponName = e.target.value; preview(); });
      on('eB', 'input', e => { draft.buildName = e.target.value; preview(); });
      on('eD', 'input', e => { draft.description = e.target.value; preview(); });
      on('eS', 'input', e => { draft.shareCode = e.target.value.toUpperCase(); preview(); });
      on('eI', 'input', e => { draft.imageKey = e.target.value; preview(); });
      on('eC', 'change', e => { draft.category = e.target.value; repaint(); });
      on('eM', 'change', e => { draft.mode = e.target.value;
        if (draft.mode === 'DMZ') draft.categoryRank = null; else draft.dmzRangeRank = null; repaint(); });
      on('eCopy', 'click', () => { navigator.clipboard?.writeText(draft.shareCode); S.toast('Gunsmith code copied.'); });
      on('imgSuggest', 'click', () => {
        draft.imageKey = draft.weaponName.toUpperCase().replace(/\s+/g, '-') + '-' + (sibs.indexOf(b) + 1);
        repaint();
      });
      on('imgClear', 'click', () => { draft.imageKey = ''; repaint(); });
      on('attAdd', 'click', () => { draft.attachments.push(''); draft.attachmentSlots.push(''); repaint(); });
      document.querySelectorAll('[data-att]').forEach(i =>
        i.addEventListener('input', e => { draft.attachments[+e.target.dataset.att] = e.target.value; preview(); }));
      document.querySelectorAll('[data-slot]').forEach(i =>
        i.addEventListener('input', e => { draft.attachmentSlots[+e.target.dataset.slot] = e.target.value; preview(); }));
      document.querySelectorAll('[data-del]').forEach(x => x.onclick = () => {
        const i = +x.dataset.del; draft.attachments.splice(i, 1); draft.attachmentSlots.splice(i, 1); repaint();
      });
      document.querySelectorAll('[data-bg]').forEach(t => t.onclick = () => {
        if (t.dataset.bg === 'meta') draft.isMeta = !draft.isMeta; else draft.isToxic = !draft.isToxic;
        repaint();
      });
      document.querySelectorAll('[data-rank]').forEach(t => t.onclick = () => {
        draft.categoryRank = t.dataset.rank || null; repaint(); });
      document.querySelectorAll('[data-dmz]').forEach(t => t.onclick = () => {
        draft.dmzRangeRank = t.dataset.dmz || null; repaint(); });
      document.getElementById('eCancel').onclick = () => S.closeDrawer();
      document.getElementById('eDel').onclick = () => { S.closeDrawer(); confirmDelete(b); };
      document.getElementById('eSave').onclick = save;
    }

    function save() {
      const FIELDS = ['weaponName','buildName','category','mode','shareCode','description','imageKey',
                      'isMeta','isToxic','categoryRank','dmzRangeRank'];
      const rows = FIELDS.filter(k => String(before[k]) !== String(draft[k]))
        .map(k => [k, dash(before[k]), dash(draft[k])]);
      if (before.attachments.join('|') !== draft.attachments.join('|'))
        rows.push(['attachments', before.attachments.join(', ') || '—', draft.attachments.join(', ') || '—']);
      if (!rows.length) { S.toast('Nothing changed.'); S.closeDrawer(); return; }
      const badgeChanged = ['isMeta','isToxic','categoryRank','dmzRangeRank'].some(k => before[k] !== draft[k]);
      const sibSnap = sibs.map(x => ({ x, isMeta:x.isMeta, isToxic:x.isToxic,
                                       categoryRank:x.categoryRank, dmzRangeRank:x.dmzRangeRank }));
      const opId = 'arm-edit-' + b.id;
      S.Store.onInvert(opId, () => {
        Object.assign(b, before);
        b.attachments = before.attachments.slice(); b.attachmentSlots = before.attachmentSlots.slice();
        sibSnap.forEach(s2 => Object.assign(s2.x, { isMeta:s2.isMeta, isToxic:s2.isToxic,
          categoryRank:s2.categoryRank, dmzRangeRank:s2.dmzRangeRank }));
        renderAll();
      });
      Object.assign(b, draft);
      b.attachments = draft.attachments.filter(Boolean);
      b.attachmentSlots = draft.attachmentSlots.slice(0, b.attachments.length);
      /* Badge propagation — the bot does this, so the portal must, or the two disagree
       * the moment an admin edits from either side. */
      if (badgeChanged) siblings(b).forEach(x => {
        x.isMeta = b.isMeta; x.isToxic = b.isToxic;
        x.categoryRank = b.categoryRank; x.dmzRangeRank = b.dmzRangeRank;
      });
      if (badgeChanged && sibs.length > 1)
        rows.push(['badges propagated', `${sibs.length} build(s) of ${b.weaponName}`, 'all updated']);
      S.Store.add({ id:opId, tier:1, name:`${b.weaponName} — ${b.buildName}`,
        verb:`${rows.length} field${rows.length > 1 ? 's' : ''} changed`, realm:'armory',
        op:'loadout.edit', rows });
      S.closeDrawer(); renderAll();
      S.toast(`${b.weaponName} — ${rows.length} change(s) staged.`, 'Undo', () => S.Store.revert(opId));
    }
  }

  function confirmDelete(b) {
    S.confirm({
      op:'loadout.delete', tier:1, danger:true, confirm:'Stage deletion',
      title:`Delete ${b.weaponName} — ${b.buildName}?`,
      body:`<p class="dw-p">Removes this build, its <b>${b.attachments.length}</b> attachments and its
              Gunsmith code. ${siblings(b).length > 1
                ? `The other <b>${siblings(b).length - 1}</b> ${b.weaponName} build(s) stay, and the card's
                   “Build N of M” counter renumbers.`
                : `<b>This is the only ${b.weaponName} build</b> — the weapon disappears from
                   <code>/gunsmiths</code> entirely.`}</p>
            <p class="dw-p">Tier 1 in core/ops: apply() captures the whole document before removing it, so the inverse is exact and this is reversible after it commits. It is still a deletion, which is why it is drawn as one. </p>`,
      onConfirm(){
        const i = st.builds.indexOf(b);
        S.Store.onInvert('arm-del-' + b.id, () => { st.builds.splice(i, 0, b); renderAll(); });
        st.builds.splice(i, 1);
        S.Store.add({ id:'arm-del-' + b.id, name:`${b.weaponName} — ${b.buildName}`,
          verb:'deleted', realm:'armory', op:'loadout.delete', destroys:true,
          rows:[['Build', `${b.weaponName} — ${b.buildName}`, 'removed'],
                ['Attachments', b.attachments.join(', ') || '—', '—'],
                ['Gunsmith code', dash(b.shareCode), '—'],
                ['Image', dash(b.imageKey), '—']] });
        renderAll();
      }
    });
  }

  /* ══════════════════════════════════════════════════════════════════════════════
   * ADD A BUILD — rebuilt 2026-08-24 on Harkirat's critique, which was right on every count:
   *   "SO barebone. It doesn't even state in any way which fields are required/optional.
   *    MP and DMZ *do not* and should not share the same modal. Where's the gunsmith code
   *    field? why are attachments in 1 line? that's so unintuitive for an IMMERSIVE DESKTOP
   *    PORTAL. Those placeholder texts look more like real filled in text than placeholder.
   *    where's the URL, cloudinary public ID fields? Wheres the badge fields?"
   *
   * The old form was FIVE FIELDS. That is not a coincidence — it was Discord's modal shape
   * reproduced in a browser, and Discord's five-field cap is the single constraint this portal
   * exists to escape (see .claude/rules/manage-panel.md: the loadout modal is at the cap, which
   * is why Build Name and Share Code had to share one pipe-delimited field there). Copying that
   * shape here inherits a limit nothing imposes and then defers the rest to "the editor" —
   * two screens for one act of creation.
   *
   * 🔴 MODE IS NOT A FIELD, AND THE OLD SELECT WAS A REAL DEFECT, not only a design choice.
   * `core/ops/loadouts.js`'s upsertBulkBlocks does `{ ...rawEntry, mode }` and overwrites mode
   * with the PAGE's mode unconditionally; the bot removed Mode from its own paste format on
   * 2026-08-22 for exactly this reason, after a DMZ export pasted on the MP page silently
   * reassigned every build. A Mode dropdown here offers a choice the write path ignores.
   * So: two buttons, and which one you press decides it — matching the bot exactly.
   * ══════════════════════════════════════════════════════════════════════════════ */

  const CODE_RE = /^(?:\d[A-Za-z]){5}$/;          // 10 chars, alternating digit/letter
  const codeOk  = v => CODE_RE.test(v.replace(/\s/g, ''));

  function openAdd(mode) {
    const m = mode || st.armMode;
    const isMP = m === 'MP';
    const accent = isMP ? 'var(--draw)' : 'var(--ret)';
    /* Five rows because 123 of 133 real builds carry exactly five attachments — that is the
     * Gunsmith's own shape, not a guess. The rows are free text rather than slot-typed selects:
     * the bot stores a flat `attachments` array and `attachmentSlots` is empty on all 133
     * documents, so typing a slot here would invent a structure the data does not have. */
    const attRow = i => `<div class="atr" data-i="${i}">
        <span class="atn">${i + 1}</span>
        <input class="ati" data-att="${i}" placeholder="${['Muzzle — e.g. Monolithic Suppressor','Barrel — e.g. MIP Light Barrel (Short)','Stock — e.g. No Stock','Ammunition — e.g. 48 Round Extended Mag','Rear grip — e.g. Granulated Grip Tape'][i] || 'Attachment'}">
        <button class="atx" data-clr="${i}" aria-label="Clear attachment ${i + 1}" tabindex="-1">&#10005;</button>
      </div>`;

    S.drawer({
      /* 🔴 THE EYEBROW SAYS WHAT THIS DOES, NOT WHAT IT IS CALLED INTERNALLY. It used to read
       * "loadouts.add · tier 1" — Harkirat: "what does that even mean...?" He is right: an op id
       * and a reversibility tier are things I need while wiring this, and things a person using
       * the portal has no way to decode. The op id is kept, on the title attribute, so it stays
       * one hover away for whoever is wiring it. */
      eyebrow:`<span title="loadout.add · tier 1">Adding to the ${m} armory &middot; you can undo this</span>`,
      title:`New ${m} build`, wide:true,
      body:`<div class="dwbody bform" style="--c:${accent}">
        <p class="bf-legend"><span class="req">*</span> required &mdash; everything else can be filled in now or later.
          Nothing is written until you commit on Review.</p>

        <section class="bf-sec">
          <h4 class="bf-h">Identity</h4>
          <div class="bed-g2">
            <label class="dwfield"><span>Weapon name <span class="req">*</span></span>
              <input id="nW" placeholder="AK117" autocomplete="off">
              <i class="bf-hint">As it should read on the card. <code>weaponKey</code> is derived from it &mdash; lowercased, spaces stripped.</i></label>
            <label class="dwfield"><span>Build name</span>
              <input id="nB" placeholder="Aggressive Flex" autocomplete="off">
              <i class="bf-hint">A human variant label, not a code. Defaults to <b>Build 1</b>.</i></label>
          </div>
          <label class="dwfield"><span>Category <span class="req">*</span></span>
            <select id="nC">${F.CATS.map(c => `<option value="${c.key}">${c.key} &mdash; ${c.label}</option>`).join('')}</select>
            <i class="bf-hint">Mode is <b>${m}</b> and is not a field here &mdash; it is decided by which button you pressed, exactly as it is in the bot.</i></label>
        </section>

        <section class="bf-sec">
          <h4 class="bf-h">Attachments <span class="bf-n" id="nAn">0 of 5</span></h4>
          <p class="bf-p">In Gunsmith order, top to bottom. <b>123 of 133</b> real builds carry exactly five.</p>
          <div class="atlist">${[0, 1, 2, 3, 4].map(attRow).join('')}</div>
        </section>

        ${isMP ? `<section class="bf-sec">
          <h4 class="bf-h">Gunsmith code</h4>
          <label class="dwfield"><span>Share code</span>
            <input id="nCode" placeholder="1C2B4A8B9A" autocomplete="off" spellcheck="false" maxlength="12">
            <i class="bf-hint" id="nCodeHint">Ten characters, alternating digit then letter. Leave it blank if you do not have one yet.</i></label>
        </section>` : `<section class="bf-sec">
          <h4 class="bf-h">Gunsmith code</h4>
          <p class="bf-p bf-na"><b>DMZ builds have no share code.</b> That screen does not generate one, so the field is not shown rather than shown and ignored.</p>
        </section>`}

        <section class="bf-sec">
          <h4 class="bf-h">Image</h4>
          <label class="dwfield"><span>Cloudinary public ID or full URL</span>
            <input id="nImg" placeholder="AK117-1" autocomplete="off" spellcheck="false">
            <i class="bf-hint" id="nImgHint">Convention is <code>WEAPON-N</code>, all caps, spaces to hyphens. A full <code>https://</code> URL is accepted and stored as-is &mdash; but it will not round-trip through a bulk export, because only a real key does.</i></label>
        </section>

        <section class="bf-sec">
          <h4 class="bf-h">Badges</h4>
          <p class="bf-p">🔴 <b>Badges describe the WEAPON, not this one build.</b> The bot propagates them across every build sharing this <code>weaponKey</code> and mode &mdash; setting one here changes the others.</p>
          <div class="bf-badges">
            <label class="bf-tog"><input type="checkbox" id="nMeta"><span>Meta</span></label>
            <label class="bf-tog"><input type="checkbox" id="nTox"><span>Toxic</span></label>
            <label class="dwfield bf-rank"><span>Category rank</span>
              <select id="nRank"><option value="">Unranked</option>${
                ['best', 'top3', 'top4', 'top5'].map(r => `<option value="${r}">${F.RANK_LABEL[r]}</option>`).join('')}</select></label>
            ${isMP ? '' : `<label class="dwfield bf-rank"><span>DMZ range rank</span>
              <select id="nDmz"><option value="">None</option>${
                F.DMZ_RANGE_TOKENS.map(t => `<option value="${t}">${t.replace('-', ' · ')}</option>`).join('')}</select></label>`}
          </div>
        </section>

        <section class="bf-sec">
          <h4 class="bf-h">Description</h4>
          <label class="dwfield"><span>Usage blurb</span>
            <textarea id="nDesc" rows="2" placeholder="When to reach for this build."></textarea>
            <i class="bf-hint">Rendered as a blockquote above the attachments. <b>2 of 133</b> builds carry one.</i></label>
        </section>
      </div>`,
      actions:`<button class="btn" id="nCancel">Cancel</button>
               <button class="btn go" id="nAdd" disabled>Stage ${m} build</button>`
    });

    const $ = id => document.getElementById(id);
    const atts = () => [...document.querySelectorAll('.ati')].map(i => i.value.trim()).filter(Boolean);
    /* The button states WHY it is disabled rather than sitting dead. A disabled control with no
     * reason is the same defect as a check that cannot fail: the reader learns nothing from it. */
    const sync = () => {
      const w = $('nW').value.trim();
      $('nAn').textContent = `${atts().length} of 5`;
      const code = $('nCode') ? $('nCode').value.trim() : '';
      const codeBad = code && !codeOk(code);
      if ($('nCodeHint')) {
        $('nCodeHint').classList.toggle('bad', !!codeBad);
        $('nCodeHint').innerHTML = !code
          ? 'Ten characters, alternating digit then letter. Leave it blank if you do not have one yet.'
          : codeBad ? `<b>${esc(code)}</b> is not a share code &mdash; ten characters, alternating digit then letter, like <code>1C2B4A8B9A</code>.`
                    : 'Reads as a valid share code.';
      }
      const img = $('nImg').value.trim();
      $('nImgHint').classList.remove('bad');
      if (img) $('nImgHint').innerHTML = /^https?:\/\//i.test(img)
        ? 'Read as a <b>full URL</b> &mdash; stored as-is, and it will not survive a bulk-export round trip.'
        : `Read as a <b>Cloudinary key</b> &mdash; it will resolve to <code>${esc(F.CLOUD_BASE + img)}</code>.`;
      const ok = !!w && !codeBad;
      $('nAdd').disabled = !ok;
      $('nAdd').title = ok ? '' : (!w ? 'A weapon name is required' : 'Fix the share code first');
    };
    document.querySelectorAll('.bform input,.bform select,.bform textarea').forEach(el => {
      el.addEventListener('input', sync); el.addEventListener('change', sync);
    });
    document.querySelectorAll('[data-clr]').forEach(b => b.onclick = () => {
      document.querySelector(`.ati[data-att="${b.dataset.clr}"]`).value = ''; sync(); });
    sync();

    $('nCancel').onclick = () => S.closeDrawer();
    $('nAdd').onclick = () => {
      const name = $('nW').value.trim();
      if (!name) return;
      const list = atts();
      const code = $('nCode') ? $('nCode').value.trim().replace(/\s/g, '') : '';
      const nb = { id:'new-' + Date.now(), weaponKey:name.toLowerCase().replace(/\s+/g, ''),
        weaponName:name, category:$('nC').value, mode:m,
        buildName:$('nB').value.trim() || 'Build 1',
        attachments:list, attachmentSlots:[], imageKey:$('nImg').value.trim(),
        description:$('nDesc').value.trim(), shareCode:code,
        isMeta:$('nMeta').checked, isToxic:$('nTox').checked,
        categoryRank:$('nRank').value || null,
        dmzRangeRank:($('nDmz') && $('nDmz').value) || null, lastUpdated:F.today };
      S.Store.onInvert('arm-add-' + nb.id, () => { st.builds = st.builds.filter(x => x !== nb); renderAll(); });
      st.builds.push(nb);
      /* The staged record states what was actually captured, field by field — the old one
       * hardcoded "Image: not set" and "Code: not set" because the form could not collect them. */
      S.Store.add({ id:'arm-add-' + nb.id, name:`${nb.weaponName} — ${nb.buildName}`,
        verb:'added', realm:'armory', op:'loadout.add', scope:'armory.' + m.toLowerCase(),
        rows:[{ field:'Weapon', was:'—', becomes:nb.weaponName },
              { field:'Category', was:'—', becomes:nb.category },
              { field:'Mode', was:'—', becomes:nb.mode },
              { field:'Attachments', was:'—', becomes:list.length ? list.join(', ') : '(none)' },
              { field:'Share code', was:'—', becomes:code || '(none)' },
              { field:'Image', was:'—', becomes:nb.imageKey || '(none)' },
              { field:'Badges', was:'—', becomes:[nb.isMeta && 'meta', nb.categoryRank,
                  nb.dmzRangeRank, nb.isToxic && 'toxic'].filter(Boolean).join(', ') || '(none)' }] });
      S.closeDrawer(); renderAll();
      S.arrive(`#rows tr[data-id="${nb.id}"]`);
      S.toast(`${nb.weaponName} staged in ${m}.`, 'Open editor', () => openBuild(nb.id));
    };
  }

  /* ═══ MANIFEST ═══ */
  /* `inMode()` is the ONE place the partition lives. Every count, every view and every
   * export reads through it, so nothing can accidentally show a DMZ build on the MP page. */
  const inMode = () => st.builds.filter(b => b.mode === st.armMode);
  function visible() {
    let l = inMode();
    if (st.cat !== 'all') l = l.filter(b => b.category === st.cat);
    if (st.defect) { const d = DEFECTS.find(x => x.key === st.defect); if (d) l = l.filter(d.test); }
    if (st.q) l = l.filter(b => (b.weaponName + ' ' + b.buildName + ' ' + b.shareCode + ' ' +
      b.attachments.join(' ') + ' ' + b.description).toLowerCase().includes(st.q));
    const k = st.sort.k, dir = st.sort.dir;
    return l.sort((x, y) => ((x[k] > y[k]) ? 1 : (x[k] < y[k]) ? -1 : 0) * dir);
  }
  function setFilter({ cat, defect }) {
    st.cat = cat; st.defect = defect;
    document.querySelectorAll('[data-filter]').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.filter === cat)));
    renderAll();
  }
  function renderRows() {
    const l = visible();
    count.textContent = `${l.length} of ${st.builds.length}`;
    activeFilter.hidden = !(st.defect || st.cat !== 'all');
    if (!activeFilter.hidden) {
      const d = DEFECTS.find(x => x.key === st.defect);
      activeFilter.innerHTML = `<div class="afbar">
        <span class="aflab">Showing</span>
        ${st.cat !== 'all' ? `<span class="afchip" style="--c:${catOf(st.cat).hex}"><i></i>${catOf(st.cat).label}</span>` : ''}
        ${d ? `<span class="afchip warn"><i></i>${d.label}</span>` : ''}
        <span class="afn">${l.length} build${l.length === 1 ? '' : 's'}</span>
        <button class="afclear" id="afClear">Clear</button></div>`;
      document.getElementById('afClear').onclick = () => setFilter({ cat:'all', defect:null });
    }
    rows.innerHTML = l.length ? l.map(b => {
      const def = defectsFor(b), c = catOf(b.category);
      return `<tr data-id="${b.id}" class="${st.selected.has(b.id) ? 'sel' : ''}">
        <td><span class="cb ${st.selected.has(b.id) ? 'on' : ''}" role="checkbox"
              aria-checked="${st.selected.has(b.id)}" tabindex="0" data-cb="${b.id}"></span></td>
        <td class="n"><span class="ncell"><span class="dot" style="background:${c.hex}"></span>
          <span><b>${b.weaponName}</b><span class="rowmeta">${b.mode} · ${b.attachments.length} attachments</span></span></span></td>
        <td>${c.label}</td>
        <td>${b.buildName}</td>
        <td class="code drop-sm">${b.mode === 'DMZ' ? '<span class="none">DMZ — no code</span>' : (b.shareCode || '<span class="none">not set</span>')}</td>
        <td class="det"><span class="attpeek">${b.attachments.length
          ? b.attachments.slice(0, 2).map(a => `<em>${a}</em>`).join('') +
            (b.attachments.length > 2 ? `<em class="more">+${b.attachments.length - 2}</em>` : '')
          : '<span class="none">none</span>'}</span></td>
        <td class="ta-r"><span class="tiers">
          ${b.isMeta ? '<b class="bdg">META</b>' : ''}
          ${b.categoryRank ? `<b class="bdg rank">${b.categoryRank.toUpperCase()}</b>` : ''}
          ${b.dmzRangeRank ? `<b class="bdg dmz">${b.dmzRangeRank}</b>` : ''}
          ${b.isToxic ? '<b class="bdg toxic">TOXIC</b>' : ''}
          ${def.length ? `<b class="bdg bad" data-tip="${def.map(d => d.label).join(' · ')}">${def.length}&#9888;</b>` : ''}
          ${!b.isMeta && !b.categoryRank && !b.dmzRangeRank && !b.isToxic && !def.length ? '<span class="none">—</span>' : ''}
        </span></td>${S.removeCell(b.weaponName + ' ' + b.buildName)}</tr>`;
    }).join('') : `<tr><td colspan="8"><div class="empty">
        ${st.q || st.defect || st.cat !== 'all'
          ? `<b>No build matches that.</b> ${st.builds.length} are loaded — clear the filter to see them.`
          : `<b>The armory is empty.</b> <code>/gunsmiths</code> would return nothing at all, which is
             not a state this bot has ever been in.`}</div></td></tr>`;
    rows.querySelectorAll('tr[data-id]').forEach(tr => {
      tr.querySelector('[data-rmv]').onclick = e => { e.stopPropagation(); removeBuild(tr.dataset.id); };
      tr.onclick = e => { if (!e.target.closest('[data-cb]') && !e.target.closest('[data-rmv]')) openBuild(tr.dataset.id); };
    });
    rows.querySelectorAll('[data-cb]').forEach(cb => cb.onclick = e => {
      e.stopPropagation();
      st.selected.has(cb.dataset.cb) ? st.selected.delete(cb.dataset.cb) : st.selected.add(cb.dataset.cb);
      renderRows(); renderBulkBar();
    });
  }
  /* 🔴 THE SAME DEFECT SEASON HAD. This bar was rendered into `<div id="bulk">`, which sits
   * in normal flow AFTER a 31-row table, so selecting a build near the top put every verb it
   * unlocked most of a screen below the fold. It docks now, through Shell.selection — one
   * implementation, so a fix to the bar is a fix on every realm rather than on whichever page
   * someone happened to be looking at. `#bulk` stays as a hidden host. */
  function renderBulkBar() {
    bulk.hidden = true;
    const picked = inMode().filter(b => st.selected.has(b.id));
    if (!picked.length) { S.selection({ count:0 }); return; }
    const n = picked.length, many = n > 1 ? 's' : '';
    const cats = new Set(picked.map(b => b.category));
    const weapons = new Set(picked.map(b => b.weaponName));
    const metas = picked.filter(b => b.isMeta).length;

    const flag = want => {
      const snap = picked.map(b => ({ b, was:b.isMeta }));
      S.Store.onInvert('arm-meta', () => { snap.forEach(s2 => { s2.b.isMeta = s2.was; }); renderAll(); });
      picked.forEach(b => { b.isMeta = want; siblings(b).forEach(x => { x.isMeta = want; }); });
      S.Store.add({ id:'arm-meta', name:n + ' build' + many,
        verb:want ? 'flagged Meta' : 'Meta cleared', realm:'armory', op:'loadout.edit', tier:1,
        scope:'armory.' + st.armMode,
        rows:picked.map(b => ({ field:b.weaponName + ' — ' + b.buildName, was:String(!want), becomes:String(want) })) });
      st.selected.clear(); renderAll();
    };

    S.selection({
      count:n, tier:2,
      summary:weapons.size + ' weapon' + (weapons.size > 1 ? 's' : '') + ' · ' +
              cats.size + ' categor' + (cats.size > 1 ? 'ies' : 'y') + ' · ' +
              (metas ? metas + ' already Meta' : 'none flagged Meta'),
      onClear(){ st.selected.clear(); renderRows(); renderBulkBar(); },
      actions:[
        { label:metas === n ? 'Clear Meta' : 'Flag Meta', on(){ flag(metas !== n); } },
        { label:'Export ' + n, on(){
            S.Export.file('dioreo-builds-selection.txt', bulkText(picked));
            S.toast(n + ' build' + many + ' exported in the block format. Pasting it back restores them exactly.');
          } },
        { label:'Remove ' + n, kind:'danger', on(){
            S.confirm({ op:'loadout.bulkDelete', tier:2, danger:true,
              confirm:'Remove ' + n, title:'Remove ' + n + ' build' + many + '?',
              body:'<p class="dw-p">These are <b>staged, not deleted</b> — nothing is written until you commit on Review.</p>' +
                   '<ul class="dw-l">' + picked.slice(0, 8).map(b => '<li>' + b.weaponName + ' &mdash; ' + b.buildName + '</li>').join('') +
                   (n > 8 ? '<li>and ' + (n - 8) + ' more</li>' : '') + '</ul>' +
                   (orphanWeapons(picked).length
                     ? '<div class="callout"><b>' + orphanWeapons(picked).join(', ') + '</b> would be left with no builds at all, ' +
                       'and a weapon with no builds vanishes from <code>/gunsmiths</code> entirely — it stops being searchable, ' +
                       'not just empty.</div>' : ''),
              onConfirm(){
                const snap = st.builds.slice();
                S.Store.onInvert('arm-bulkdel', () => { st.builds = snap; renderAll(); });
                st.builds = st.builds.filter(b => !st.selected.has(b.id));
                S.Store.add({ id:'arm-bulkdel', name:n + ' build' + many, verb:'removed',
                  realm:'armory', op:'loadout.bulkDelete', tier:2, destroys:true, scope:'armory.' + st.armMode,
                  rows:picked.slice(0, 6).map(b => ({ field:b.weaponName + ' — ' + b.buildName,
                    was:b.attachments.length + ' attachments', becomes:'(removed)' })) });
                st.selected.clear(); renderAll();
              } });
          } }
      ]
    });
  }

  /* Which weapons would stop existing. This is the only consequence of an Armory delete that
   * is not visible in the rows being deleted, so it is the only one the dialog spells out. */
  function orphanWeapons(picked){
    const going = new Set(picked.map(b => b.id));
    const left = {};
    inMode().forEach(b => { if (!going.has(b.id)) left[b.weaponName] = true; });
    return [...new Set(picked.map(b => b.weaponName))].filter(w => !left[w]);
  }

  /* Single remove. core/ops registers loadout.delete as tier 1 — the inverse is exact. */
  function removeBuild(id){
    const b = st.builds.find(x => x.id === id); if (!b) return;
    const orphan = orphanWeapons([b]);
    S.confirm({
      title:'Remove ' + b.weaponName + ' — ' + b.buildName + '?', op:'loadout.delete', tier:1,
      danger:true, confirm:'Remove',
      body:'<p class="dw-p">It is <b>staged, not deleted</b> — nothing is written until you commit on Review, ' +
           'and the tray can put it back until then.</p>' +
           (orphan.length ? '<div class="callout"><b>' + b.weaponName + '</b> has no other build in ' + st.armMode +
             '. Removing this one takes the weapon out of <code>/gunsmiths</code> entirely.</div>' : ''),
      onConfirm(){
        const at = st.builds.indexOf(b);
        st.builds.splice(at, 1); st.selected.delete(id);
        const sid = 'rm-build-' + id;
        S.Store.add({ id:sid, op:'loadout.delete', name:b.weaponName + ' — ' + b.buildName,
          verb:'removed', tier:1, realm:'armory', scope:'armory.' + st.armMode,
          rows:[{ field:'Build', was:b.weaponName + ' — ' + b.buildName, becomes:'(removed)' },
                { field:'Attachments', was:String(b.attachments.length), becomes:'—' }] });
        S.Store.onInvert(sid, () => { st.builds.splice(at, 0, b); renderAll(); });
        S.toast('Removed. Staged, not gone.', 'Undo', () => S.Store.revert(sid));
        renderAll();
      }
    });
  }

  /* The four scopes /manage's loadout pages actually offer (exportupto5, exportcategory,
   * exportall per mode), plus the one only a portal can: what you are currently looking at. */
  function armoryScopes(){
    const m = st.armMode, tag = m.toLowerCase();
    const cat = st.cat === 'all' ? null : st.cat;
    return [
      { id:'armory.' + tag, label:'Every ' + m + ' build', note:'The whole mode, in the block format the paste box accepts.',
        count:inMode().length, unit:'builds', file:'dioreo-' + tag + '-builds.txt', build:() => bulkText(inMode()) },
      { id:'armory.' + tag + '.view', label:'This view', note:'Exactly the rows the current search and filters leave standing.',
        count:visible().length, unit:'builds', file:'dioreo-' + tag + '-view.txt', build:() => bulkText(visible()) },
      { id:'armory.' + tag + '.cat', label:cat ? 'Category — ' + catOf(cat).label : 'Category — pick one first',
        note:cat ? 'Matches /manage loadouts export by category.' : 'Pick a category chip in the Manifest, then export.',
        count:cat ? inMode().filter(b => b.category === cat).length : 0, unit:'builds',
        file:'dioreo-' + tag + '-' + (cat || 'category') + '.txt',
        build:() => cat ? bulkText(inMode().filter(b => b.category === cat)) : '' },
      { id:'armory.' + tag + '.five', label:'First five in this filter', note:'Matches /manage loadouts "Up To 5".',
        count:Math.min(5, visible().length), unit:'builds', file:'dioreo-' + tag + '-five.txt',
        build:() => bulkText(visible().slice(0, 5)) }
    ];
  }

  /* ═══ CHROME ═══ */
  /* The legend names only states PRESENT on screen (audit rule 7). Hardcoding both meant
   * that when every build had a defect, the key advertised "clean" and sent the reader
   * hunting for something that did not exist. */
  function renderKey() {
    /* Same split as the masthead — a build whose ONLY mark is its age is stale, not broken, and
       104 of 133 carry it. The legend names the states actually on screen, so it can now name
       both, either, or neither. */
    const marks = st.builds.map(defectsFor);
    const any   = marks.some(d => !d.length);
    const bad   = marks.some(d => d.some(x => !x.age));
    const old   = marks.some(d => d.length && !d.some(x => !x.age));
    key.innerHTML = (any ? `<span class="l"><i></i>clean</span>` : '') +
                    (bad ? `<span class="c"><i></i>needs repair</span>` : '') +
                    (old ? `<span class="l"><i></i>stale</span>` : '');
  }
  function renderStats() {
    const pool = inMode();
    /* ⚠️ SAY WHICH POOL. This read "31 builds" while Home's card read "133 builds" for the same
     * collection — Armory counts the builds in the ACTIVE MODE that were exported into this
     * package; Home counts the real collection. Neither number was wrong and together they were
     * incoherent, because both used the bare word "builds". The label now carries the scope, and
     * Home says "36 of 133" rather than implying it is showing all of them. */
    sBuilds.textContent = pool.length;
    const kb = document.getElementById('kBuilds');
    if (kb) kb.textContent = `${st.armMode} builds shown`;
    sRanked.textContent = pool.filter(b => rankOf(b)).length;
    /* The alarm counts FAULTS. Age is reported next to it, never folded into it — see the
       `age:true` note on the stale defect. */
    sFlags.textContent  = pool.filter(b => defectsFor(b).some(d => !d.age)).length;
    sFlags.classList.toggle('zero', sFlags.textContent === '0');
    const sStale = document.getElementById('sStale');
    if (sStale) sStale.textContent = pool.filter(b => defectsFor(b).some(d => d.age)).length;
    const failing = DEFECTS.filter(d => flagged(d).length).length;
    viewMeta.textContent =
      st.mode === 'rack'     ? `${pool.filter(b => rankOf(b)).length} of ${pool.length} ranked · ${F.LOADOUT_STATS[st.armMode]} ${st.armMode} builds live`
    : st.mode === 'coverage' ? `${failing} of ${DEFECTS.length} checks failing`
    : st.mode === 'compare'  ? `${st.cmp.length} of 2 picked`
    : `${pool.length} ${st.armMode} builds · pipe format, lossless round trip`;
  }
  function syncStaged(){ sStaged.textContent = S.Store.all().length; S.mountRail('armory'); }
  function showView(v) {
    st.mode = v;
    document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === v)));
    viewRack.hidden = v !== 'rack'; viewCoverage.hidden = v !== 'coverage';
    viewCompare.hidden = v !== 'compare'; viewBulk.hidden = v !== 'bulk';
    document.getElementById('crumbView').textContent =
      { rack:'Tier board', coverage:'Repairs', compare:'Compare', bulk:'Bulk & export' }[v];
    if (v === 'compare') renderCompare();
    if (v === 'bulk') renderBulk();
    renderStats();
  }

  /* Only categories that EXIST in this mode get a chip — DMZ has 8 builds across 5
   * categories, and offering the other two would advertise an empty result. */
  function renderCatChips() {
    const present = new Set(inMode().map(b => b.category));
    catChips.innerHTML = F.CATS.filter(c => present.has(c.key)).map(c =>
      `<button class="chip topic" data-filter="${c.key}" aria-pressed="${st.cat === c.key}"
        style="--c:${c.hex}"><i></i>${c.label} <em>${inMode().filter(b => b.category === c.key).length}</em></button>`).join('');
    catChips.querySelectorAll('[data-filter]').forEach(c => c.onclick = () =>
      setFilter({ cat:c.dataset.filter, defect:null }));
  }
  renderCatChips();
  document.querySelectorAll('[data-arm]').forEach(b => b.onclick = () => {
    if (st.armMode === b.dataset.arm) return;
    st.armMode = b.dataset.arm;
    st.cat = 'all'; st.defect = null; st.cmp = []; st.selected.clear();
    document.querySelectorAll('[data-arm]').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.arm === st.armMode)));
    document.getElementById('crumbView').textContent = st.armMode + ' · ' +
      { rack:'Tier board', coverage:'Repairs', compare:'Compare', bulk:'Bulk & export' }[st.mode];
    renderCatChips(); renderAll();
  });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => showView(b.dataset.view));
  document.querySelectorAll('[data-filter]').forEach(c => c.onclick = () =>
    setFilter({ cat:c.dataset.filter, defect:null }));
  document.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    st.sort = { k, dir: st.sort.k === k ? -st.sort.dir : 1 };
    document.querySelectorAll('th.sortable').forEach(x => x.className = x.className.replace(/ sorted-\w+/, ''));
    th.className += st.sort.dir === 1 ? ' sorted-asc' : ' sorted-desc';
    renderRows();
  });
  q.addEventListener('input', e => { st.q = e.target.value.toLowerCase().trim(); renderRows(); });
  addBtn.onclick = openAdd;
  /* Both entry points, one handler — the masthead action and the in-table shortcut must never be
   * able to disagree about what "add a build" does. `N` matches Season, so the shortcut means the
   * same thing in every realm rather than something different per page. */
  /* `mhNew` stays in the DOM but hidden: Shell.mastheadExport mounts the "take out" line
   * AFTER it, and several selectors elsewhere still anchor on it. Removing it would move the
   * export line into a different grid cell on this realm only. */
  document.getElementById('mhNewMP').onclick = () => openAdd('MP');
  document.getElementById('mhNewDMZ').onclick = () => openAdd('DMZ');
  document.addEventListener('keydown', e => {
    if (e.key !== 'n' && e.key !== 'N') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
    if (document.querySelector('.drawer.open')) return;
    e.preventDefault(); openAdd();
  });
  cbAll.onclick = () => {
    const l = visible(), all = l.every(b => st.selected.has(b.id));
    l.forEach(b => all ? st.selected.delete(b.id) : st.selected.add(b.id));
    cbAll.setAttribute('aria-checked', String(!all));
    renderRows(); renderBulkBar();
  };
  S.onAfterRevert = renderAll;

  function renderAll(){ renderCatChips(); renderRack(); renderCoverage(); if (st.mode === 'compare') renderCompare();
    S.mastheadExport({ host:'#mhNew', scopes:armoryScopes,
      summary:() => inMode().length + ' ' + st.armMode + ' builds · 4 scopes' });
    if (st.mode === 'bulk') renderBulk(); renderRows(); renderBulkBar(); renderKey(); renderStats(); syncStaged(); }
  renderAll();
  (window.Shell||window.S).holdTop();
  S.audit({
    interactions: () => [
      { name:'build editor',  run: () => openBuild(st.builds[0].id) },
      { name:'add build',     run: openAdd },
      { name:'format guide',  run: openGuide }
    ],
    /* Three states now, not two — and audit rule 7 is what forced it: splitting age out of the
       alarm made the legend advertise "stale" while every row still declared itself either
       "needs repair" or "clean", so the key sent a reader hunting for a state nothing showed.
       The legend and this list must describe the same world. */
    states: () => st.builds.map(b => { const d = defectsFor(b);
      return !d.length ? 'clean' : d.some(x => !x.age) ? 'needs repair' : 'stale'; })
  });
})();
</script>
</body></html>
