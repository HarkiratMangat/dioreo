<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armory · Dioreo Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css?v=1787586710"><link rel="stylesheet" href="assets/app.css?v=1787586710">
</head><body>
<div class="app">
  <header id="hdr"></header>
  <nav class="rail" aria-label="Realms"></nav>
  <main>
    <div class="masthead">
      <div class="mh-id">
        <h1>Armory</h1>
        <span class="job">Every build the bot can show a player, ranked within its category, with whatever is wrong with it named.</span>
      </div>
      <div class="mh-stats">
        <span class="stat"><span class="v" id="sBuilds"></span> <span class="k" id="kBuilds">builds</span></span>
        <span class="stat"><span class="v" id="sRanked"></span> <span class="k">ranked</span></span>
        <span class="stat stg"><span class="v" id="sStaged">0</span> <span class="k">staged</span></span>
        <span class="stat warn"><span class="v" id="sFlags"></span> <span class="k">need repair</span></span>
        <!-- Age sits beside the alarm rather than inside it: same information, honest weight. -->
        <span class="stat"><span class="v" id="sStale"></span> <span class="k">stale</span></span>
      </div>
      <!-- 🔴 TWO BUTTONS, NOT ONE WITH A MODE DROPDOWN INSIDE. Which button you press decides
           the mode, because that is what the write path actually does: core/ops/loadouts.js
           overwrites mode with the page's own, so a dropdown offered a choice nothing honoured.
           Harkirat: "MP and DMZ *do not* and should not share the same modal". -->
      <div class="mh-add" id="mhAdd" role="group" aria-label="Add a build">
        <span class="mh-add-k">Add</span>
        <button class="pill mh-t" id="mhNewMP" style="--c:var(--draw)" accesskey="n">
          <span class="dot"></span>New MP build<kbd class="mh-k">N</kbd></button>
        <button class="pill mh-t" id="mhNewDMZ" style="--c:var(--ret)">
          <span class="dot"></span>New DMZ build</button>
      </div>
      <button class="pill lead mh-new" id="mhNew" hidden accesskey="b">
        <span class="mh-plus" aria-hidden="true">+</span> New build
        <kbd>N</kbd>
      </button>
    </div>

    <section class="panel" aria-label="Armory view">
      <div class="ph">
        <div class="modesw" role="tablist" aria-label="Loadout mode">
          <button role="tab" data-arm="MP"  aria-pressed="true">MP</button>
          <button role="tab" data-arm="DMZ" aria-pressed="false">DMZ</button>
        </div>
        <div class="seg" role="tablist" aria-label="View">
          <button role="tab" data-view="rack" aria-pressed="true">Tier board</button>
          <button role="tab" data-view="coverage" aria-pressed="false">Repairs</button>
          <button role="tab" data-view="compare" aria-pressed="false">Compare</button>
          <button role="tab" data-view="bulk" aria-pressed="false">Bulk &amp; export</button>
        </div>
        <span class="key" id="key"></span>
        <span class="sp" id="viewMeta"></span>
      </div>
      <div id="viewRack"></div>
      <div id="viewCoverage" hidden></div>
      <div id="viewCompare" hidden></div>
      <div id="viewBulk" hidden></div>
    </section>

    <section class="panel" style="margin-top:16px" aria-label="Manifest">
      <div class="mtools">
        <span class="srch"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <label class="sr" for="q">Search builds</label>
          <input id="q" type="search" placeholder="Search builds"   data-ph-full="Search weapon, attachment or Gunsmith code" autocomplete="off">
        </span>
        <button class="chip" data-filter="all" aria-pressed="true">All</button>
        <span class="chipset" id="catChips"></span>
        <!-- 🔴 THIS WAS THE PRIMARY ACTION ON THE PAGE, parked under a filter row inside the
             manifest — measured earlier at 1208px in an 828px viewport, i.e. below the fold, on
             the realm that manages 133 builds. It moved to the masthead beside the numbers, the
             same place Season's `+ New item` lives, so the two realms answer "how do I add one"
             the same way. This one stays as the in-context shortcut for when you are already
             scrolled to the table. -->
        <button class="chip go" id="addBtn">+ Add build</button>
        <span class="rt" id="count"></span>
      </div>
      <div id="activeFilter" hidden></div>
      <div class="mscroll"><table class="mtable">
        <colgroup><col class="c-cb"><col class="c-item"><col class="c-type"><col class="c-win">
                  <col class="c-spark"><col class="c-detail"><col class="c-state"><col class="c-ra"></colgroup>
        <thead><tr>
          <th><span class="cb" id="cbAll" role="checkbox" aria-checked="false" tabindex="0"></span></th>
          <th class="sortable" data-sort="weaponName">Weapon</th>
          <th class="sortable" data-sort="category">Category</th>
          <th class="sortable" data-sort="buildName">Build</th>
          <th class="drop-sm">Gunsmith code</th>
          <th>Attachments</th>
          <th class="ta-r">Badges</th>
          <th class="ra"><span class="sr">Remove</span></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div id="bulk" hidden></div>
    </section>
  </main>
</div>
<aside class="tray" hidden></aside>

<script src="assets/fixtures.js?v=1787586710"></script>
<script src="assets/timeline.js?v=1787586710"></script>
<script src="assets/shell.js?v=1787586710"></script>
<script>
(function () {
  const F = window.FIX, S = window.Shell;
  S.init('armory');
  S.mountHeader('Armory', 'Tier board');

  /* ══════════════════════════════════════════════════════════════════════════
   * ⚠️ EVERYTHING BELOW IS SHAPED BY models/Loadout.js, NOT BY A GUESS.
   * An earlier version of this page invented its own fields and got three things
   * wrong in ways that changed the design:
   *   · `attachments` is an ARRAY OF NAMES ("Monolithic Suppressor", …) — it was
   *     rendered as a COUNT ("5"), which tells an admin nothing they can act on.
   *   · `categoryRank` is 'best' | 'top3' | 'top4' | 'top5' | null. The tier board
   *     used S/A/B, a vocabulary that exists nowhere in the bot.
   *   · `buildName` is a human variant label ("Build 1", "Aggressive Flex"), NOT a
   *     code. The real Gunsmith code is `shareCode`, a separate field.
   * The fixtures are 36 real documents exported from the dev collection.
   * ══════════════════════════════════════════════════════════════════════════ */

  /* 🔴 THE UNRANKED TIER HOLDS 61 OF 133 BUILDS — 46% of the catalogue in one row, and it is
   * the row with the least to say. At the 36-document sample this was invisible; at real scale
   * the Tier board is 11,490px, fourteen screens, and the useful part is the top three rows.
   * So a tier collapses, and the one that carries almost half the catalogue starts collapsed.
   * Remembered per session, like the Season lanes it borrows the idea from. */
  const st = { tclosed:new Set((() => { try { return JSON.parse(sessionStorage.getItem('dioreo-armory-tclosed')) || ['null']; } catch (e) { return ['null']; } })()),
    mode:'rack', q:'', cat:'all', armMode:'MP', defect:null, selected:new Set(),
    sort:{ k:'weaponName', dir:1 },
    builds: F.builds.map(b => ({ ...b, attachments:b.attachments.slice(), attachmentSlots:b.attachmentSlots.slice() })),
    cmp:[]
  };
  const catOf   = k => F.CATS.find(c => c.key === k) || { key:k, label:k, hex:'#9DAAB4' };
  const accent  = b => catOf(b.category).hex;
  const dash    = v => (v === null || v === undefined || v === '') ? '—' : v;
  const sentence= t => t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
  /* Builds of the same weapon+mode share their badges — see models/Loadout.js: badges
   * describe the WEAPON, not one variant, and handlers/manage.js propagates them on edit. */
  const siblings = b => st.builds.filter(x => x.weaponKey === b.weaponKey && x.mode === b.mode);

  /* ═══ DEFECTS ═══ every one is a real property of the real schema, not a made-up
   * health score. Mechanical ones can be fixed without a judgement call; the rest
   * need a person, and the queue keeps that line visible. */
  const STALE_DAYS = 120;
  const daysOld = b => Math.round((new Date('2026-08-24') - new Date(b.lastUpdated)) / 86400000);
  const DEFECTS = [
    { key:'nocode',  label:'No Gunsmith code',   mech:false,
      why:'MP builds are expected to carry a real 10-character code. 123 of 133 do.',
      test:b => b.mode === 'MP' && !b.shareCode },
    { key:'noimage', label:'No image',           mech:false,
      why:'The card omits the gallery entirely — an honest render, but the build looks bare next to its siblings.',
      test:b => !b.imageKey },
    { key:'exturl',  label:'Image is an external URL', mech:true,
      why:'imageKey should be a Cloudinary key so the delivery URL carries f_auto,q_auto. One row still points off-platform.',
      test:b => (b.imageKey || '').startsWith('http') },
    { key:'attcount',label:'Not 5 attachments',  mech:false,
      why:'123 of 133 builds carry exactly 5. A different count is legal and sometimes right — CODM allows more with certain perks — so this is a prompt, not an error.',
      test:b => b.attachments.length !== 5 },
    /* 🔴 NOT a per-build defect. attachmentSlots is populated only by /autobuild's vision
     * pass, and ZERO of the 133 stored builds carry it — so testing it per row flags the
     * entire collection and the number stops meaning anything. It is surfaced as a
     * collection-level observation in the Repairs view instead. `collection:true` keeps it
     * out of defectsFor() while still letting the view state it. */
    { key:'noslots', label:'No slot labels',     mech:false, collection:true,
      why:'attachmentSlots is only ever filled by /autobuild vision extraction, and zero of the 133 stored builds carry it. That is the state of the whole collection, not a fault in any one row — so it does not count against a build.',
      test:b => b.attachmentSlots.length === 0 },
    /* 🔴 `age:true` — TIME PASSING IS NOT A FAULT, AND COUNTING IT AS ONE BROKE THE HEADLINE.
     * Measured over the real collection: 104 of 133 builds are stale and 13 have an actual
     * defect, so "NEED REPAIR" read 109 in alarm orange — 89% of it "this record is a few months
     * old". A number that is red on almost every row is not a signal, it is the wallpaper, and
     * the 13 rows worth acting on were invisible inside it.
     * It stays a defect: the Repairs queue must still list it, because a stale build IS probably
     * wrong and that is the realm's whole argument. It just does not get to be the alarm. */
    { key:'stale',   label:'Not updated in ' + STALE_DAYS + ' days', mech:false, age:true,
      why:'Attachment pools shift every season; a build untouched for a season is probably wrong.',
      test:b => daysOld(b) > STALE_DAYS },
    { key:'dupcode', label:'Duplicate Gunsmith code', mech:false,
      why:'Two builds sharing a code means one was pasted from the other. The card copies it verbatim, so both are wrong for someone.',
      test:b => !!b.shareCode && st.builds.filter(x => x.shareCode === b.shareCode).length > 1 },
    /* MP-only checks are declared as such rather than silently passing on DMZ — a check that
     * cannot fail in the current mode is hidden, not reported as clean. */
    { key:'rankgap', label:'Meta but unranked',  mech:true,
      why:'A build flagged Meta with no categoryRank renders a Meta badge and no tier. Meta implies it is at least Top 5 in its category.',
      test:b => b.mode === 'MP' && b.isMeta && !b.categoryRank }
  ];
  const defectsFor = b => DEFECTS.filter(d => !d.collection && d.test(b));
  const flagged    = d => inMode().filter(d.test);

  /* ═══ THE DISCORD PREVIEW ═══ mirrors utils/loadoutRender.js's buildLoadoutCardBody()
   * component for component, so what is shown here is what Discord will send:
   *   # WEAPON · badges · divider · > description · ### Attachments · ### Gunsmith Code
   *   · image · -# CATEGORY • Build N of M • Updated
   * 🔴 DMZ builds never render a Gunsmith Code — the DMZ Gunsmith screen does not expose
   * one, so showing buildName there as if it were a code would be a lie the bot does not
   * tell. That rule lives in loadoutRender.js and is reproduced, not re-invented. */
  function badgeLine(b) {
    const out = [];
    if (b.isMeta) out.push('META');
    if (b.mode === 'MP' && b.categoryRank)
      out.push(b.categoryRank === 'best' ? 'BEST ' + catOf(b.category).label.toUpperCase()
                                         : b.categoryRank.toUpperCase() + ' ' + catOf(b.category).label.toUpperCase());
    if (b.mode === 'DMZ' && b.dmzRangeRank) out.push(b.dmzRangeRank.replace('-', ' ').toUpperCase() + ' DMZ');
    if (b.isToxic) out.push('TOXIC');
    return out;
  }
  function loadoutCard(b, opts = {}) {
    const sibs = siblings(b), idx = sibs.indexOf(b) + 1;
    const code = b.mode !== 'DMZ' && (b.shareCode || b.buildName);
    const badges = badgeLine(b);
    return `<div class="dcard lc" style="--c:${accent(b)}">
      <h6>${b.weaponName}</h6>
      ${badges.length ? `<div class="lc-badges">${badges.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
      <div class="lc-rule"></div>
      ${b.description ? `<blockquote class="lc-desc">${sentence(b.description)}</blockquote>` : ''}
      <div class="lc-h">Attachments</div>
      <ul class="lc-att">${b.attachments.length
        ? b.attachments.map((a, i) => `<li><code>${a}</code>${b.attachmentSlots[i]
            ? `<em>${b.attachmentSlots[i]}</em>` : ''}</li>`).join('')
        : '<li class="none">none recorded</li>'}</ul>
      ${code ? `<div class="lc-h">Gunsmith Code</div><div class="lc-code">${code}</div>` : ''}
      ${b.imageKey ? `<div class="lc-img"><img src="${F.imageUrl(b.imageKey)}" alt="${b.weaponName} ${b.buildName}"
           loading="lazy" onerror="this.closest('.lc-img').classList.add('failed')"><span class="lc-imgfail">
           Cloudinary did not return this image — <code>${b.imageKey}</code></span></div>`
        : `<div class="lc-noimg">No image on this build, so the card omits the gallery entirely.</div>`}
      <div class="lc-foot">${b.category} • Build ${idx} of ${sibs.length} • Updated ${b.lastUpdated}</div>
    </div>`;
  }

  /* ═══ VIEW 1 · TIER BOARD ═══ keyed on the REAL rank vocabulary. */
  const RANKS = F.RANK_ORDER;                         // best · top3 · top4 · top5 · null
  const rankOf = b => b.mode === 'DMZ'
    ? (b.dmzRangeRank ? (b.dmzRangeRank.split('-')[0]) : null)
    : (b.categoryRank || null);
  const rankKey = r => r === null ? 'unranked' : r;

  function renderRack() {
    const pool = visible();
    const groups = RANKS.map(r => ({ r, list: pool.filter(b => rankOf(b) === r) }));
    viewRack.innerHTML = `
      <div class="rack">
        ${groups.map(({ r, list }) => `
          <div class="trow t-${rankKey(r)} ${st.tclosed.has(String(r)) ? 'tclosed' : ''}" data-tier="${r === null ? 'null' : r}">
            <div class="trow-h" role="button" tabindex="0" aria-expanded="${!st.tclosed.has(String(r))}"
                 data-tt="${r === null ? 'null' : r}"
                 aria-label="${F.RANK_LABEL[String(r)]}, ${list.length} weapon group(s) — click to collapse">
              <!-- 🔴 "T3" AND "Top 3" ARE THE SAME FACT. The header rendered a token, a count and
                   a label as three separate lines, so every tier restated itself — Harkirat:
                   "whats with the redundant titles? t3 and top 3 mean the same thing." And the
                   shapes differed between rows: the best tier got a star and a note, T3/T4/T5
                   got a bold token and nothing, so five headers in one rail read as three
                   designs. One shape now: [mark] [label] [count], then a note ONLY where there
                   is something to add. The mark is a star for best and an em dash for unranked
                   — the two rows whose meaning is not already in their label; the numbered
                   tiers need no glyph, because "Top 3" is not improved by also saying "T3".
                   ⚠️ NO BACKTICKS IN THIS COMMENT. It sits inside a template literal, and the
                   first draft wrote a token in backticks and killed the whole page. FOURTH time
                   in this package — and the first time a gate caught it instead of a person:
                   portal:refs now parses every inline script, and it reported this within a
                   minute of the edit. -->
              <span class="trow-k" aria-hidden="true">${r === null ? '—' : r === 'best' ? '★' : ''}</span>
              <span class="trow-t">${F.RANK_LABEL[String(r)]}</span>
              <span class="trow-n">${list.length}</span>
              <!-- 🔴 THE SAME SENTENCE RENDERED THREE TIMES. "ranked within its own category,
                   not across the armory" appeared on T3, T4 AND T5 — and again, in full, in the
                   note under the whole rack. Four copies of one fact, each taking a third of its
                   row's header height. A note earns its place by saying something the row above
                   it does not; only 'best' and 'unranked' do. -->
              <!-- 🔴 "one per category" WAS WRONG, and only the full 133-document catalogue
                   could show it. At 36 documents the Best row held 6 cards and the sentence
                   looked true. At 133 it holds 18 BUILDS across 7 categories — because a badge
                   describes the WEAPON and the bot propagates it across every build sharing a
                   weaponKey and mode. AR has five: BAL-27 Build 1, 2 and 3 among them. So the
                   count was never wrong; the sentence was. Measured, every category has exactly
                   one best WEAPON and none has zero. -->
              ${r === 'best' ? `<span class="trow-note">one <b>weapon</b> per category</span>`
                : r === null ? '<span class="trow-note">no rank set; these render with no tier badge</span>' : ''}
              <span class="trow-cv" aria-hidden="true">&#9662;</span>
            </div>
            <div class="trow-body" data-drop="${r === null ? '' : r}">
              ${list.length ? groupChips(list)
                : `<div class="trow-empty">Nothing at ${F.RANK_LABEL[String(r)]} — drag a build here, or focus one and press Alt plus an arrow key.</div>`}
            </div>
          </div>`).join('')}
      </div>
      <p class="racknote"><b>Why the Best row holds 18 cards and not 7.</b> A badge describes the
        <b>weapon</b>, not one build of it — the bot propagates it across every build sharing a
        <code>weaponKey</code> and mode, so BAL-27's five builds each carry it. Measured against the
        full 133-document catalogue: every category has exactly one best weapon, and none has zero.
        Rank is <b>per category</b>: “Best” means best AR, best SMG, and so on — the bot
        renders it as <code>BEST ASSAULT</code> on the card. The vocabulary is the schema's own
        (<code>best</code> / <code>top3</code> / <code>top4</code> / <code>top5</code>), validated by
        <code>adminParser.js</code>'s <code>parseLoadoutBadges()</code>.
        <b>DMZ builds never use it</b> — they carry <code>dmzRangeRank</code> instead, which also encodes a
        combat range (<code>best-close</code>, <code>best-midlong</code>).</p>`;
    viewRack.querySelectorAll('[data-tt]').forEach(h => {
      const toggle = () => {
        const k = h.dataset.tt;
        st.tclosed.has(k) ? st.tclosed.delete(k) : st.tclosed.add(k);
        try { sessionStorage.setItem('dioreo-armory-tclosed', JSON.stringify([...st.tclosed])); } catch (e) {}
        renderRack();
      };
      h.onclick = toggle;
      h.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    });
    wireRack();
  }
  /* 🔴 SIX PAIRS OF ADJACENT CARDS READ AS DUPLICATES. LOCUS/LOCUS, DR-H/DR-H, HS0405/HS0405,
   * LK24/LK24, HVK-30/HVK-30, SWITCHBLADE X9 ×2 — two builds of one weapon, told apart only by
   * a stored `buildName` that is an INDEX ("Build 1", "Build 2"). The DATA is right; the
   * presentation was asking a reader to spot a one-character difference between two otherwise
   * identical rectangles, which reads as a duplicate-render bug. Siblings in the same tier now
   * render as ONE group, weapon named once at the top, builds inside it — which is also what
   * they actually are. The inner elements stay `.bchip`, so drag-to-rerank is untouched. */
  function groupChips(list) {
    const by = new Map();
    list.forEach(b => { const k = b.weaponName; if (!by.has(k)) by.set(k, []); by.get(k).push(b); });
    /* 🔴 ONE CARD SHAPE, ALWAYS — a weapon with one build is a group of one. The first version
     * returned a bare `.bchip` for singles and a `.bgrp` for multiples, so the rack showed TWO
     * VISUAL LANGUAGES side by side for the same kind of object. Harkirat: "why are these
     * different colors/styles, like i'm confused why is 1 a sleek dark style, while the other is
     * a lifted grey style?" Because they were literally different components. A single card
     * carried --raised with a 3px accent edge; a group carried --sunk with a header band and no
     * edge, and the two sat adjacent in the same row. */
    return [...by.values()].map(g => `
      <div class="bgrp" style="--c:${catOf(g[0].category).hex}">
        <div class="bgrp-h">
          <span class="bgrp-w"><i aria-hidden="true"></i><b>${g[0].weaponName}</b></span>
          <span class="bgrp-m">
            ${g.some(b => b.isMeta) ? '<span class="bc-meta">META</span>' : ''}
            <span class="bgrp-n">${g.length} build${g.length > 1 ? 's' : ''}</span>
          </span>
        </div>
        ${g.map(chip).join('')}
      </div>`).join('');
  }
  function chip(b) {
    const def = defectsFor(b), c = catOf(b.category);
    return `<article class="bchip" draggable="true" data-id="${b.id}" style="--c:${c.hex}"
              tabindex="0" role="button"
              aria-label="${b.weaponName} ${b.buildName}, ${F.RANK_LABEL[String(rankOf(b))]}. Alt plus up or down re-ranks it.">
      <span class="bc-top"><span class="bc-w">${b.weaponName}</span>
        ${b.isMeta ? '<span class="bc-meta" title="Meta">META</span>' : ''}</span>
      <span class="bc-b">${b.buildName}</span>
      <span class="bc-foot">
        <span class="bc-mode">${b.mode}</span>
        ${b.dmzRangeRank ? `<span class="bc-dmz">${b.dmzRangeRank}</span>` : ''}
        ${b.isToxic ? '<span class="bc-tox" title="Toxic">&#9763;</span>' : ''}
        <span class="bc-att" data-tip="${b.attachments.length} attachments">${b.attachments.length}&#215;</span>
        ${def.length ? `<span class="bc-bad" data-tip="${def.map(d => d.label).join(' · ')}">${def.length}</span>` : ''}
      </span>
    </article>`;
  }

  const TIER_SEQ = RANKS;
  function moveToTier(id, to, focusAfter) {
    const b = st.builds.find(x => x.id === id); if (!b) return false;
    const isDmz = b.mode === 'DMZ';
    const was = isDmz ? b.dmzRangeRank : b.categoryRank;
    const next = isDmz && to ? (was && was.includes('-') ? to + '-' + was.split('-')[1] : to) : to;
    if (was === next) return false;
    /* Inverse FIRST, and it re-renders — a bare field reassignment leaves the chip in the
     * wrong tier after an undo, which is the surface disagreeing with its own state. */
    S.Store.onInvert('rank-' + b.id, () => {
      if (isDmz) b.dmzRangeRank = was; else b.categoryRank = was; renderAll();
    });
    if (isDmz) b.dmzRangeRank = next; else b.categoryRank = next;
    S.Store.add({ id:'rank-' + b.id, tier:1, name:`${b.weaponName} — ${b.buildName}`,
      verb:`${F.RANK_LABEL[String(was)]} → ${F.RANK_LABEL[String(to)]}`, realm:'armory',
      op:'loadout.edit',
      rows:[[isDmz ? 'dmzRangeRank' : 'categoryRank', dash(was), dash(next)],
            ['Applies to', `${siblings(b).length} build(s) of ${b.weaponName}`, 'badges describe the weapon']] });
    renderAll();
    const landed = viewRack.querySelector(`.bchip[data-id="${b.id}"]`);
    if (landed) { landed.classList.add('settled');
      landed.closest('.trow-body')?.classList.add('flash');
      if (focusAfter) landed.focus();
      setTimeout(() => { landed.classList.remove('settled');
        landed.closest('.trow-body')?.classList.remove('flash'); }, 340); }
    S.toast(`${b.weaponName} → ${F.RANK_LABEL[String(to)]}.`, 'Undo',
      () => { S.Store.revert('rank-' + b.id); });
    return true;
  }

  function wireRack() {
    let dragId = null;
    viewRack.querySelectorAll('.bchip').forEach(ch => {
      ch.addEventListener('dragstart', e => { dragId = ch.dataset.id; ch.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move'; });
      ch.addEventListener('dragend', () => { dragId = null; ch.classList.remove('dragging');
        viewRack.querySelectorAll('.trow-body').forEach(t => t.classList.remove('over')); });
      ch.addEventListener('click', () => openBuild(ch.dataset.id));
      ch.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBuild(ch.dataset.id); return; }
        if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && (e.altKey || e.metaKey)) {
          e.preventDefault();
          const b = st.builds.find(x => x.id === ch.dataset.id); if (!b) return;
          const i = TIER_SEQ.indexOf(rankOf(b));
          const j = e.key === 'ArrowUp' ? i - 1 : i + 1;
          if (j < 0 || j >= TIER_SEQ.length) { S.toast(j < 0 ? 'Already at Best.' : 'Already unranked.'); return; }
          moveToTier(ch.dataset.id, TIER_SEQ[j], true);
        }
      });
    });
    viewRack.querySelectorAll('.trow-body').forEach(z => {
      z.addEventListener('dragover', e => { if (!dragId) return; e.preventDefault(); z.classList.add('over'); });
      z.addEventListener('dragleave', () => z.classList.remove('over'));
      z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over');
        moveToTier(dragId, z.dataset.drop || null, false); });
    });
  }

  /* A mechanical fix has ONE correct answer derivable from the row. Everything else needs a
   * person, which is why the queue never offers to bulk-fix a judgement call. */
  function fixMechanical() {
    const plan = [];
    st.builds.forEach(b => {
      if ((b.imageKey || '').startsWith('http'))
        plan.push({ b, field:'imageKey', was:b.imageKey,
          now:(b.weaponName.toUpperCase().replace(/\s+/g, '-') + '-' + (siblings(b).indexOf(b) + 1)) });
      if (b.mode === 'MP' && b.isMeta && !b.categoryRank)
        plan.push({ b, field:'categoryRank', was:null, now:'top5' });
    });
    if (!plan.length) { S.toast('Nothing mechanical left to fix.'); return; }
    S.drawer({
      eyebrow:'loadouts.repair · tier 2', title:`Fix ${plan.length} mechanical defect${plan.length > 1 ? 's' : ''}`, wide:true,
      body:`<div class="dwbody">
        <p class="dw-p">Each of these has one correct value derivable from the row itself. Anything
          needing a judgement call is deliberately absent — <b>Review each</b> on a specific defect
          card is where those go.</p>
        <div class="rvgrid"><div class="rvhead"><span>Build</span><span>Was</span><span>Becomes</span></div>
        ${plan.map(p => `<div class="rvr">
          <span class="rvk">${p.b.weaponName} — ${p.b.buildName}<br><em style="color:var(--ink3);font-size:var(--t-xs)">${p.field}</em></span>
          <span class="rvwas">${dash(p.was)}</span><span class="rvnow">${p.now}</span></div>`).join('')}</div>
      </div>`,
      actions:`<button class="btn" id="fmCancel">Cancel</button>
               <button class="btn go" id="fmGo">Stage ${plan.length} fix${plan.length > 1 ? 'es' : ''}</button>`
    });
    document.getElementById('fmCancel').onclick = () => S.closeDrawer();
    document.getElementById('fmGo').onclick = () => {
      const snap = plan.map(p => ({ b:p.b, field:p.field, was:p.b[p.field] }));
      S.Store.onInvert('arm-repair', () => { snap.forEach(x => { x.b[x.field] = x.was; }); renderAll(); });
      plan.forEach(p => { p.b[p.field] = p.now; });
      S.Store.add({ id:'arm-repair', name:`${plan.length} mechanical fixes`, verb:'repaired',
        realm:'armory', op:'loadout.edit',
        rows:plan.map(p => [`${p.b.weaponName} ${p.field}`, dash(p.was), p.now]) });
      S.closeDrawer(); renderAll();
      S.toast(`${plan.length} fixes staged.`, 'Undo', () => S.Store.revert('arm-repair'));
    };
  }

  function cmpRows(a, b) {
    const F2 = [
      ['Category', x => x.category], ['Mode', x => x.mode],
      ['Gunsmith code', x => x.mode === 'DMZ' ? '— (DMZ has no code)' : dash(x.shareCode)],
      ['Attachments', x => x.attachments.length + ' — ' + (x.attachments.join(', ') || 'none')],
      ['Meta', x => x.isMeta ? 'yes' : 'no'], ['Toxic', x => x.isToxic ? 'yes' : 'no'],
      ['Category rank', x => dash(x.categoryRank)], ['DMZ range rank', x => dash(x.dmzRangeRank)],
      ['Image', x => dash(x.imageKey)], ['Description', x => dash(x.description)],
      ['Updated', x => x.lastUpdated]
    ];
    return F2.map(([k, get]) => {
      const va = String(get(a)), vb = String(get(b));
      return `<tr class="${va === vb ? 'same' : 'diff'}"><td class="cmpf">${k}</td>
        <td class="dnow">${va}</td><td class="dnow">${vb}</td></tr>`;
    }).join('');
  }

  /* ═══ VIEW 4 · BULK & EXPORT ═══
   * The Loadouts page in /manage offers TEN actions: add · edit · delete · bulkadd ·
   * bulkreplace · bulkdelete · exportupto5 · exportcategory · exportall · formatguide
   * (utils/manageActions.js). An earlier version of this page implemented three of them
   * and silently dropped the rest, which is what "a skeleton with makeup" means in
   * practice: the surface looked complete because nothing on it named what was absent. */
  /* 🔴 THIS WAS THE RETIRED SEVEN-SEGMENT PIPE LINE, and the bot REJECTS it outright.
   * `utils/adminParser.js`'s parseBulkLoadoutList was rewritten 2026-08-22 to a labelled
   * block, and it does not silently re-read the old shape — under the old positional reading
   * `Weapon | Category` half-parses into a weapon literally named "Weapon", so it fails loudly
   * on purpose (Harkirat's explicit no-back-compat call). The mockup was emitting text that
   * cannot be pasted back into the bot it is a mockup OF, and its own format guide documented
   * the retired shape. Nothing caught it because an export's OUTPUT is never re-read by anything
   * here — the round trip was assumed, never closed.
   * 🔴 AND MODE IS GONE, which was itself a bug fix: the parser demanded a segment whose value
   * upsertBulkBlocks overwrote with the page's own mode, so exporting DMZ builds and pasting
   * them on the MP page silently reassigned every one of them. Ported verbatim from
   * formatLoadoutsAsBulkText — identity on line one, every optional field on its own line,
   * everything else is an attachment. */
  const bulkLine = b => {
    const badges = [b.isMeta ? 'meta' : null, b.categoryRank,
                    b.dmzRangeRank ? String(b.dmzRangeRank).replace('-', '') : null,
                    b.isToxic ? 'toxic' : null].filter(Boolean).join(', ');
    const lines = [b.weaponName + ' | ' + b.category];
    if (b.buildName) lines.push('Build: ' + b.buildName);
    /* A raw-URL imageKey is legitimate stored state but re-importing one would only re-save
     * the same external URL, so only a real Cloudinary key round-trips. */
    if (b.imageKey && !String(b.imageKey).startsWith('http')) lines.push('Image: ' + b.imageKey);
    if (b.shareCode) lines.push('Code: ' + b.shareCode);
    if (badges) lines.push('Badges: ' + badges);
    (b.attachments || []).forEach(a => lines.push('- ' + a));
    return lines.join('\n');
  };
  /* Blocks are separated by a BLANK line, not a newline — parseBulkLoadoutList splits on
   * /\n\s*\n/. Joining with a single newline would emit one enormous unparseable block. */
  const bulkText = list => list.map(bulkLine).join('\n\n');

  function previewPaste() {
    const lines = document.getElementById('bvIn').value.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) { document.getElementById('bvOut').innerHTML =
      `<div class="bvmsg">Nothing pasted yet.</div>`; return; }
    const parsed = lines.map(l => {
      const p = l.split('|').map(x => x.trim());
      const [weaponName, buildName, category, mode, atts, shareCode, imageKey, description] = p;
      const errs = [];
      if (p.length < 5) errs.push('needs at least 5 fields');
      if (category && !F.CATS.some(c => c.key === category)) errs.push(`unknown category "${category}"`);
      if (mode && !['MP', 'DMZ'].includes(mode)) errs.push(`mode must be MP or DMZ`);
      const existing = st.builds.find(b => b.weaponName === weaponName && b.buildName === buildName);
      return { weaponName, buildName, category, mode, atts:(atts || '').split(',').map(x => x.trim()).filter(Boolean),
               shareCode, imageKey, description, errs, existing:!!existing };
    });
    const bad = parsed.filter(p => p.errs.length);
    document.getElementById('bvOut').innerHTML = `
      <div class="bvres">
        <div class="bvsum">
          <b>${parsed.filter(p => p.existing && !p.errs.length).length}</b> update
          <b>${parsed.filter(p => !p.existing && !p.errs.length).length}</b> new
          ${bad.length ? `<b class="bad">${bad.length}</b> rejected` : ''}
        </div>
        ${parsed.map(p => `<div class="bvrow ${p.errs.length ? 'bad' : p.existing ? 'upd' : 'new'}">
          <span class="bvtag">${p.errs.length ? 'reject' : p.existing ? 'update' : 'new'}</span>
          <span><b>${p.weaponName || '(no weapon)'}</b> · ${p.buildName || '(no build name)'}
            <em>${p.atts.length} attachment${p.atts.length === 1 ? '' : 's'}</em>
            ${p.errs.length ? `<i class="bverr">${p.errs.join(' · ')}</i>` : ''}</span>
        </div>`).join('')}
        ${parsed.some(p => !p.errs.length) ? `<button class="chip go" id="bvStage">
          Stage ${parsed.filter(p => !p.errs.length).length} change(s)</button>` : ''}
      </div>`;
    const bs = document.getElementById('bvStage');
    if (bs) bs.onclick = () => {
      const good = parsed.filter(p => !p.errs.length);
      S.Store.onInvert('arm-bulk', () => {});
      S.Store.add({ id:'arm-bulk', tier:2, name:`${good.length} builds`, verb:'bulk upsert',
        realm:'armory', op:'loadout.bulkAdd',
        rows:good.map(p => [`${p.weaponName} — ${p.buildName}`,
          p.existing ? 'existing build' : '—', `${p.atts.length} attachments`]) });
      S.toast(`${good.length} build(s) staged from paste.`, 'Undo', () => S.Store.revert('arm-bulk'));
      renderAll();
    };
  }

      list = inMode().filter(b => b.category === c); label = `every ${st.armMode} ${catOf(c).label} build`;
    }

    document.getElementById('bvExpOut').innerHTML = `
      <div class="bvres">
        <div class="bvsum"><b>${list.length}</b> build(s) — ${label}</div>

  /* ═══ THE BUILD EDITOR ═══ the whole document, not a summary of it.

   * ARRAY (add/remove/reorder, with optional slot labels), weaponName, weaponKey (derived,
   * shown read-only so the convention is visible), category, mode, buildName, shareCode,
   * description, and every badge — including the propagation rule, which is a real
   * consequence a person has to see BEFORE they commit, not after. */
  function openBuild(id) {
    const b = st.builds.find(x => x.id === id); if (!b) return;

    const render = () => `

                `<option value="${c.key}" ${c.key === draft.category ? 'selected' : ''}>${c.key} — ${c.label}</option>`).join('')}</select></label>
              <label class="dwfield"><span>Mode</span><select id="eM">
                <option value="MP" ${draft.mode === 'MP' ? 'selected' : ''}>MP</option>
