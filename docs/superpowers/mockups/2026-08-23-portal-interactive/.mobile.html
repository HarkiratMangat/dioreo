<!DOCTYPE html><meta charset="utf-8"><title>mobile check</title>
<style>body{margin:0;background:#0b0e11;font:11px monospace;color:#889}
.row{display:flex;gap:10px;padding:10px;align-items:flex-start}
figure{margin:0}figcaption{padding:3px 0;color:#aab}
iframe{width:390px;height:840px;border:1px solid #333;display:block}</style>
<div class="row" id="r"></div>
<script>
/* A real 390px viewport per frame — an iframe's element width IS its viewport width, which is the
 * only way to see the phone layout without resizing the whole browser window. */
const P = new URLSearchParams(location.search).get('p') || 'season,armory,broadcast';
document.getElementById('r').innerHTML = P.split(',').map(n =>
  `<figure><figcaption>${n}</figcaption><iframe src="${n}.html?mob=1"></iframe></figure>`).join('');
</script>
