<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dioreo Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Big+Shoulders+Display:wght@600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css?v=1787701131"><link rel="stylesheet" href="assets/app.css?v=1787701131">
</head><body>
<!-- 🔴 HOME USED TO OVERRIDE THE GRID TO ONE COLUMN AND CARRY NO RAIL, under a comment that
     read: "the rail is the in-realm switcher, and repeating it on the page whose entire job IS
     choosing a realm would say the same thing twice." The reasoning is sound and its PREMISE is
     what was wrong — this page's own H1 is "What needs you", not "Choose a realm". Harkirat:
     "its all over the place… i feel like i'd never utilize it." The five cards existed because
     Home was believed to be a directory, and they were a SECOND AUTHORITY over the question the
     attention list already answers: the list ranks what needs you, then the cards listed every
     realm again, undifferentiated, so Armory was card #2 whether it had 13 broken builds or none.
     With the rail here, navigation is one mechanism in one place on all eight pages, and this
     page holds only its two real questions: what is wrong, and what is live. The way back to
     Home is the DIOREO/PORTAL mark, which is already a Home button in every header. -->
<div class="app">
  <header id="hdr"></header>
  <nav class="rail" aria-label="Realms"></nav>
  <main>
    <div class="home">
      <div class="masthead">
        <div class="mh-id">
          <span class="job">Dioreo admin</span>
          <h1>What needs you</h1>
        </div>
        <!-- 🔴 HOME WAS THE ONLY REALM WITH NO MASTHEAD FIGURES — the one page whose job is
             "what is the state of things" opened with a title and a three-line paragraph of
             design rationale addressed to a reviewer, costing ~180px above the fold on the page
             opened first. The lede is gone (the §F2 defect, fixed on four other pages and left
             on this one) and these four figures answer the portal's state across all five realms.
             ⚠️ THEY DO NOT REPEAT THE RAIL. The plan said "demote the cards to a compact rail
             with one figure and a state dot" — a figure there would have rebuilt the
             cards-versus-list defect one level up. The masthead answers WHAT IS THE STATE; the
             rail answers WHERE DO I GO, and carries no counts at all. -->
        <div class="mh-stats" id="mhStats"></div>
      </div>

      <!-- ⚠️ "Nothing staged" used to sit at the BOTTOM, ~1500px down, under five cards — the
           most actionable fact on the page, reached last. It is now the STAGED figure above,
           and this bar renders ONLY when there is something in it. A permanent bar that says
           "nothing staged" is a third copy of a fact the masthead already carries. -->
      <div id="resume"></div>
      <ol class="att-list" id="attList"></ol>
      <div class="hlive" id="hlive"></div>
    </div>
  </main>
</div>
<!-- No floating tray on Home: the resume bar above carries the same information with more of
     it (which realms, and both actions inline), so the tray would be a second, worse copy. -->

<script src="assets/fixtures.js?v=1787701131"></script>
<script src="assets/shell.js?v=1787701131"></script>
<script>
(function () {
  const F = window.FIX, S = window.Shell;
  const attList = document.getElementById('attList');
  const mhStats = document.getElementById('mhStats');
  const hlive   = document.getElementById('hlive');
  const resume  = document.getElementById('resume');
  S.init('home');
  S.mountHeader('Portal', 'Home');

  /* Each card answers its realm's question and then states the ONE thing in that
   * realm that currently wants a person. A dashboard that only counts rows makes
   * you open all five to find out whether anything is wrong. */
  const staged = () => S.Store.all();

  /* ⚠️ Only a SPAN can outlive the season. A draw carries one `date` and no end at all
   * (models/SeasonalData.js), so asking whether it "ends after" anything compares a release
   * to a deadline and counts every late-releasing draw as a conflict. Same class as the
   * Armory predicate note directly below — a field read as something it is not.
   *
   * ⚠️ MEASURED, and the honest result is that THE TWO PREDICATES AGREE ON TODAY'S DOCUMENT —
   * 0 against the latest deadline (dmzEnd, 2026-11-11, two months past everything here) and 2
   * against bpEnd either way, because the last draw releases 2026-09-04 and no draw falls
   * after any deadline at all. So this is a fix on REASONING with no failing input behind it,
   * and saying so matters: a change justified by a number that never actually differed is the
   * kind of claim that reads as verified and is not. The case that separates them is one
   * draw released after the season ends — add one and the old predicate calls it a conflict
   * while nothing about it has an end to compare. `it.kind === 'span'` is the guard that
   * cannot be wrong; the count that would have proved it does not exist yet. */
  const conflicts = F.items.filter(it => {
    const ends = ['bpEnd','rankEnd','dmzEnd']
      .filter(k => !F.season[k + 'TBD'] && F.season[k]).map(k => F.season[k]).sort();
    const e = ends[ends.length - 1];
    return e && it.kind === 'span' && it.endDate && it.endDate > e && !it.draft;
  }).length;

  /* Season's own Repairs panel, summarised — the home page's job is to say what wants a
   * person, and 11 draws with no calendar window is the loudest thing this season has. */
  const seasonFindings = F.seasonRepairs().reduce((n, g) => n + g.hits.length, 0);

  /* ⚠️ READ, never re-derive. This used to hold its own copy of Armory's defect predicate, and
   * the two surfaces reported different numbers for the same collection — Home said "133 builds ·
   * 33 need repair", Armory said "31 builds · 28 need repair". F.ARMORY_COUNTS is now the single
   * derivation both read (see fixtures.js), so they cannot disagree again. */
  /* ⚠️ AND IT HAPPENED AGAIN FROM THE OTHER SIDE, 2026-08-25. Armory split age out of its alarm
   * — 13 real faults, 104 merely stale — and this line still read the COMBINED number, so Home
   * said "117 builds need repair" while Armory said 11. Reading the shared derivation is not
   * enough on its own: the derivation has to carry the same DISTINCTION the surfaces make, or
   * one of them silently reports a different question's answer. */
  const flagged = F.ARMORY_COUNTS.needRepair;
  const staleBuilds = F.ARMORY_COUNTS.stale;

  /* The real Broadcast finding is not a coverage gap — it is an announcement with
   * `expiresAt: null`, which never stops on its own. The previous version read `a.posted`
   * and `a.until`, neither of which is a field on models/Announcement.js, so the filter
   * matched nothing and the count was permanently 0: a card that could never warn. */
  const forever = F.announcements.filter(a => a.state === 'live' && !a.expiresAt);
  const foreverDays = forever.length
    ? Math.max(...forever.map(a => Math.round((new Date(F.today) - new Date(a.createdAt)) / 86400000)))
    : 0;

  /* ── WHAT IS LIVE RIGHT NOW ──────────────────────────────────────────────
   * 🔴 The portal's actual subject, and Home did not answer it at all. Five cards said how
   * many rows each realm holds; not one said what a player would see this second. It is not
   * a second authority over the attention list — that list is EXCEPTIONS, this is the
   * CURRENT STATE, and they are different questions. */
  const runningToday = () => F.items
    .filter(it => !it.draft && it.start <= F.today && (it.end || it.start) >= F.today)
    .sort((a, b) => (a.end || a.start).localeCompare(b.end || b.start));
  const liveAnns = () => F.announcements.filter(a => a.state === 'live');
  /* ⚠️ READ, never re-derive — the rule this file already learned twice, for the repair count
   * and for the Armory predicate. Home had its own copy of this for about an hour and it
   * disagreed with Season's masthead by 62 days. */
  const season = () => S.seasonDaysLeft(F.season, F.today);
  const endsIn = iso => {
    const d = Math.round((new Date(iso) - new Date(F.today)) / 86400000);
    return d <= 0 ? 'ends today' : d === 1 ? 'ends tomorrow' : d + ' days left';
  };

  /* Severity is a PROPERTY OF THE KIND, not of the count — 33 builds needing a caption is not
   * more urgent than one scope only one person can use. The count only breaks ties. */
  const SEV = { conflict:95, spof:90, error:80, repair:60, forever:50, staged:40 };
  function attention() {
    const out = [];
    /* `of` is the population the count is against — "13 of 133 builds" rather than "13".
     * A number with no comparison is homework, not a glance; this is the width the five
     * near-identical buttons used to occupy. */
    const push = (kind, realm, href, text, n, act, of) =>
      out.push({ sev:SEV[kind], kind, realm, href, text, n, act, of });
    if (conflicts)          push('conflict','Season','season.html',
                                 `${conflicts} item${conflicts===1?'':'s'} run past the season's own deadlines`, conflicts, 'the Track', F.items.length);
    if (F.spof.length)      push('spof','Access','access.html',
                                 `${F.spof.length} permission${F.spof.length===1?'':'s'} held by exactly one person`, F.spof.length, 'the matrix', (F.PERM_TOKENS||[]).length);
    const errs = (F.alertStats.find(a => a.level === 'error') || {}).n || 0;
    if (errs)               push('error','Analytics','analytics.html',
                                 `${errs} error${errs===1?'':'s'} pinged`, errs, 'Health', F.OBS_TOTALS.events);
    /* 🔴 TWO ROWS BOTH READ "Open repairs" — one goes to Armory, one to Season, and a reader
       scanning the column could not tell them apart. The destination is now rendered as
       "<realm> · <view>" inside the row itself, so the realm disambiguates it and the verb
       ("Open") is gone: the row IS the control, so it does not also need to say "open". */
    if (flagged)            push('repair','Armory','armory.html',
                                 `${flagged} build${flagged===1?'':'s'} need repair`, flagged, 'Repairs', F.ARMORY_COUNTS.total);
    if (seasonFindings)     push('repair','Season','season.html',
                                 `${seasonFindings} season item${seasonFindings===1?'':'s'} to repair`, seasonFindings, 'Repairs', F.items.length);
    if (forever.length)     push('forever','Broadcast','broadcast.html',
                                 `${forever.length} announcement${forever.length===1?'':'s'} never end — oldest up ${foreverDays}d`, forever.length, 'Airtime',
                                 F.announcements.filter(a => a.state === 'live').length);
    return out.sort((a, b) => b.sev - a.sev || b.n - a.n);
  }

  /* ── THE ATTENTION ROW IS THE TARGET ──────────────────────────────────────
   * ⚠️ The comfortable reading of "those underlined buttons look bad" is "remove the
   * underline", and it hid the real question. Three affordances were stacked on one control:
   * a border said BUTTON, an underline said LINK, an arrow said NAVIGATION. Deleting the
   * text-decoration fixes a third of it. Each row already names ONE destination and ONE thing
   * wrong with it — so the row IS the target, the arrow is the only affordance left, and the
   * right column stops being a wall of five near-identical controls.
   * ⚠️ THE COST, PAID RATHER THAN AVOIDED: a whole-row target is worse for keyboard and
   * screen-reader users if it is a click handler on a div. This is a real <a>. The rank and
   * the severity bar are decorative and aria-hidden, so the accessible name is the finding
   * plus its destination — better than the old link's name ("Armory repairs") standing alone.
   * The reclaimed width says HOW BAD, which is what a rank without a denominator cannot. */
  function render() {
    const att = attention();
    attList.innerHTML = att.length
      ? att.map((a, i) => `<a class="att-row s-${a.kind}" href="${a.href}" style="--c:var(--r-${a.realm.toLowerCase()})">
          <span class="att-i" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>
          <span class="att-b" aria-hidden="true"></span>
          <span class="att-x"><b>${a.text}</b><em>${a.realm} &middot; ${a.act}</em></span>
          <span class="att-go">${a.of ? `<span class="att-sev">${a.n} of ${a.of}</span>` : ''}
            <span class="arw" aria-hidden="true">&rarr;</span></span>
        </a>`).join('')
      /* An empty state that names what it means, not "nothing here". */
      : `<li class="att-row clear"><span class="att-i">&#10003;</span><span class="att-b"></span>
           <span class="att-x"><b>Nothing needs you right now.</b>
           <em>Every page matches what the bot is serving.</em></span></li>`;

    /* ── THE FIGURES ─────────────────────────────────────────────────────────
     * The LEAD is "needs you", because that is what this page is. Its colour is the state
     * it reports — warn when there is something, plain ink at zero — which is the same rule
     * every other masthead follows: the lead takes its realm's own accent, and Home's
     * defining number IS a state. A zero lead keeps its SIZE and drops its COLOUR. */
    const needs = att.length, live = liveAnns().length, sn = season(), ops = staged();
    mhStats.innerHTML = `
      <span class="stat lead" style="--c:${needs ? 'var(--warn)' : 'var(--ink)'}">
        <span class="v" id="fNeeds">${needs}</span> <span class="k">needs you</span></span>
      <span class="stat"><span class="v" id="fDays">${sn.days === null ? '—' : sn.days}</span>
        <span class="k">${S.plural(sn.days === null ? 0 : sn.days, 'days')} left${sn.days === null ? '' : ' &middot; ' + sn.label}</span></span>
      <span class="stat"><span class="v" id="fLive">${live}</span> <span class="k">live now</span></span>
      <span class="stat stg"><span class="v" id="fStaged">${ops.length}</span> <span class="k">staged</span></span>`;
    S.markZero(document.getElementById('fNeeds'), needs);
    S.markZero(document.getElementById('fLive'), live);
    S.markZero(document.getElementById('fStaged'), ops.length, true);

    /* ── WHAT IS LIVE ────────────────────────────────────────────────────── */
    const today = runningToday(), anns = liveAnns();
    const SHOW = 5;
    hlive.innerHTML = `
      <div class="lp">
        <h2>Running right now</h2>
        <div class="hseason"><b>${F.season.currentSeasonTitle}</b>
          <span>${sn.days === null ? 'no deadline set' : sn.days + ' ' + S.plural(sn.days, 'days') + ' left &middot; ' + sn.label}</span></div>
        <p class="lsub">What a player opening the bot this second would be shown.</p>
        ${today.slice(0, SHOW).map(it => `<div class="lrow" style="--c:${(F.LANE_BY_KEY[it.lane] || {}).hex || 'var(--ink4)'}">
          <i class="ld"></i>
          <span class="lt">${it.title}</span>
          <span class="lw${it.end && (new Date(it.end) - new Date(F.today)) / 86400000 <= 2 ? ' hot' : ''}">${
            it.kind === 'span' && it.end ? endsIn(it.end) : 'today'}</span>
        </div>`).join('')}
        ${today.length > SHOW ? `<p class="lmore">${today.length - SHOW} more running &middot;
          <a href="season.html">open the Track</a></p>` : ''}
        ${!today.length ? `<p class="lmore">Nothing is scheduled for today. The season runs, but no
          draw, event or playlist opens or closes.</p>` : ''}
      </div>
      <div class="lp">
        <h2>Showing to players</h2>
        <p class="lsub">Announcements the bot is attaching to its replies.</p>
        ${anns.length ? anns.map(a => `<div class="lrow" style="--c:${(F.LANE_BY_KEY.patchNotes || {}).hex || 'var(--patch)'}">
          <i class="ld"></i>
          <span class="lt">${a.text}</span>
          <span class="lw${a.expiresAt ? '' : ' hot'}">${a.expiresAt ? endsIn(a.expiresAt) : 'never ends'}</span>
        </div>`).join('')
        : `<p class="lmore">No announcement is showing. Replies go out with nothing attached.</p>`}
        <p class="lmore"><a href="broadcast.html">Open Broadcast</a></p>
      </div>`;

    resume.innerHTML = ops.length ? `
      <div class="hres">
        <b>${ops.length} staged change${ops.length > 1 ? 's' : ''}</b>
        <span>across ${new Set(ops.map(o => o.realm || 'season')).size} realm${new Set(ops.map(o => o.realm || 'season')).size > 1 ? 's' : ''}
          — nothing is live until you commit them.</span>
        <span class="sp"></span>
        <button class="chip" id="dropAll">Discard all</button>
        <button class="chip go" id="goReview">Review &amp; commit</button>
      </div>` : '';
    if (ops.length) {
      document.getElementById('goReview').onclick = () => location.href = 'review.html';
      document.getElementById('dropAll').onclick = () => {
        S.Store.revertAll(); S.toast('All staged changes discarded.'); render();
      };
    }
  }

  S.onAfterRevert = render;
  render();
  (window.Shell||window.S).holdTop();
  S.audit();
})();
</script>
</body></html>
