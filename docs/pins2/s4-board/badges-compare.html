<!doctype html>
<meta charset="utf-8">
<title>Badge Motion Compared</title>
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Big+Shoulders+Display:wght@500;600;700&display=swap">
<!-- The board's own stylesheets, so every badge is drawn exactly as the board draws it. Deliberately dark only: these
     badges are designed for the portal's dark ground, and a light theme would compare something that does not exist. -->
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="b2.css">
<link rel="stylesheet" href="b3/board.css">
<link rel="stylesheet" href="gates.css">
<style>
  :root{--cmp-bg:#0F1418;--cmp-panel:#171E24;--cmp-rule:#2A343D;--cmp-ink:#E8EDF1;--cmp-ink2:#9DAAB4;--cmp-ink3:#85939F;--cmp-old:#FF7A45;--cmp-new:#7BDB63}
  html,body{background:var(--cmp-bg);color:var(--cmp-ink);margin:0}
  body{padding:32px 16px 64px;font:500 14px/1.5 "Space Grotesk",system-ui,sans-serif}
  .cmp{max-width:880px;margin:0 auto;display:grid;gap:28px}
  .cmp-h h1{margin:0 0 8px;font:600 26px/1.15 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.015em;text-wrap:balance}
  .cmp-h p{margin:0;max-width:68ch;color:var(--cmp-ink2);text-wrap:pretty}
  .cmp-h p b{color:var(--cmp-ink)}
  .cmp-m{display:flex;flex-wrap:wrap;gap:8px 28px;margin:18px 0 0}
  .cmp-m div{display:grid;gap:2px}
  .cmp-m dt{font:500 12px/1.3 "JetBrains Mono",monospace;color:var(--cmp-ink3)}
  .cmp-m dd{margin:0;font:600 15px/1.3 "Space Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums}
  .cmp-m dd b{color:var(--cmp-new)}
  .cmp-grid{background:var(--cmp-panel);border:1px solid var(--cmp-rule);border-radius:12px;overflow:hidden}
  .cmp-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);align-items:center;gap:16px;padding:16px 20px;border-top:1px solid var(--cmp-rule)}
  .cmp-row:first-child{border-top:0}
  .cmp-head{padding:12px 20px;font:600 12px/1.2 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--cmp-ink3)}
  .cmp-head div:nth-child(2){color:var(--cmp-old)}
  .cmp-head div:nth-child(3){color:var(--cmp-new)}
  .cmp-k{display:grid;gap:2px;min-width:0}
  .cmp-k b{font:600 14px/1.2 "Space Grotesk",system-ui,sans-serif}
  .cmp-k span{font:500 12.5px/1.4 "Space Grotesk",system-ui,sans-serif;color:var(--cmp-ink3)}
  .cmp-cell{display:flex;align-items:center;min-height:44px}
  .cmp-cell .b3-bdgs{padding-left:0;margin-left:0;box-shadow:none}
  .cmp-zoom .cmp-cell{zoom:2;min-height:40px}
  .cmp-zoom .cmp-row{padding:22px 20px}
  /* BEFORE: the retired main-thread loops back on, their compositor replacements off */
  .cmp-old .b3-vl{display:none}
  .cmp-old .b3-bdg[data-k=meta]:has(> .b3-vl > .b3-vrest)::after{background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),
    color-mix(in srgb,var(--tc) calc(40% + 60%*var(--lit)*var(--b3-amb)),white) 0%,
    color-mix(in srgb,var(--tc) calc(46% + 18%*var(--lit)),transparent) calc(24% + 34%*var(--lit)),
    color-mix(in srgb,var(--tc) 46%,transparent) 76%)}
  .cmp-old .b3-bdgs.in .b3-bdg[data-t^=top]::after{display:block;animation:b3rim 5.4s linear infinite;animation-delay:calc(var(--ph,0) * -5.4s)}
  .cmp-old .b3-bdgs.in .b3-rim{display:none!important}
  .cmp-old .b3-bdgs.in .b3-bdg[data-k=toxic]::after{display:block;animation:b3tox 17s linear infinite;animation-delay:calc(var(--ph,0) * -17s)}
  .cmp-old .b3-bdgs.in .b3-tox{display:none!important}
  @media (max-width:560px){.cmp-row{grid-template-columns:1fr 1fr;} .cmp-k{grid-column:1/-1} .cmp-head div:first-child{display:none}}
</style>
<script src="ui/armory.logic.js"></script>
<div id="cmp"></div>
<script type="module" src="cmp/badges.js"></script>
