      <div class="am-row1">
        <label class="am-hex"><s></s><em>#</em><input id="am-hex" maxlength="7" spellcheck="false" autocomplete="off"><button type="button" class="am-ib am-cp" aria-label="Copy hex" title="Copy hex"><svg class="ic"><use href="#i-copy"/></svg></button></label>
        <button type="button" class="am-new" aria-label="New colour" title="New colour"><svg class="ic"><use href="#i-shuffle"/></svg><span>New colour</span></button>
      </div></div>
    <div class="am-r">
      <div class="am-huew"><div class="am-hue" aria-label="Hue"><i></i></div></div>
      <div class="am-g am-rg"><div class="am-gl"><svg class="ic"><use href="#i-hist"/></svg><span>Recent</span><span class="am-hint" aria-hidden="true"><span class="am-hc" data-k="use"><svg class="ic"><use href="#i-check"/></svg><b></b></span></span></div><div class="am-rows am-rec"></div></div>
      <div class="am-g"><div class="am-gl"><svg class="ic"><use href="#i-bm"/></svg><span>Saved</span><span class="am-hint" aria-hidden="true"><span class="am-hc" data-k="use"><svg class="ic"><use href="#i-check"/></svg><b></b></span><span class="am-hc" data-k="rep"><svg class="ic"><use href="#i-rw"/></svg><b></b></span></span></div><div class="am-sw am-sav"></div></div>
    </div>
  </div>
</div>
<div class="tk" id="tk"></div>
<div class="tk-out"><pre id="tk-pre"></pre><button type="button" id="tk-copy">Copy values</button></div>
<script>
(()=>{
const R=document.getElementById('am'),q=s=>R.querySelector(s);
const hsv2hex=(h,s,v)=>{const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return '#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase()};
const hex2hsv=x=>{const n=parseInt(x.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]};
const hsl2hex=(h,s,l)=>{s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase()};
const lum=x=>{const n=parseInt(x.slice(1),16);return [n>>16&255,n>>8&255,n&255].map(c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4}).reduce((a,c,i)=>a+c*[.2126,.7152,.0722][i],0)};
const onInk=x=>{const L=lum(x);return (L+.05)/(0.0048+.05)>1.05/(L+.05)?'#0B0F12':'#FFFFFF'};
const rnd=()=>hsl2hex(Math.floor(Math.random()*360),55+Math.random()*20,45+Math.random()*15);
let cur='#2FC8D0',[h,s,v]=hex2hsv(cur),cols=8,nrec=2;
let recent=['#2FC8D0','#4DDF2C','#D8468F','#3F7FE0','#E1A43A','#9B5EE6','#DF523B','#58D2A1','#C9D23B','#6A7BE8','#E7719B','#39AFE0','#8FD13C'];
let saved=['#EC4899','#2FC8D0','#E1A43A',null,null,null,null,null,null,null,null,null,null,null];
const sv=q('.am-sv'),hue=q('.am-hue'),inp=q('input'),rec=q('.am-rec'),sav=q('.am-sav');
const ICON=id=>`<svg class="ic"><use href="#${id}"/></svg>`;
let built='';
function build(){
  const key=cols+'x'+nrec;if(key===built)return;built=key;
  rec.innerHTML=Array.from({length:nrec},()=>'<div class="am-sw">'+'<button type="button" class="am-s"></button>'.repeat(cols)+'</div>').join('');
  sav.innerHTML=Array.from({length:cols},(_,i)=>`<span class="am-s" data-i="${i}" data-dir="${i>=cols/2?'l':'r'}" role="button" tabindex="0">${ICON('i-plus')}<span class="am-ov"><b class="am-sh"></b><b class="am-pu"></b><b class="am-pr"></b><b class="am-dv"></b><span class="am-h"><i role="button" tabindex="-1" data-a="use">${ICON('i-check')}</i><i role="button" tabindex="-1" data-a="rep">${ICON('i-rw')}</i></span></span></span>`).join('');
}
function paint(){
  build();
  R.style.setProperty('--cur',cur);R.style.setProperty('--on-cur',onInk(cur));R.style.setProperty('--cols',cols);
  sv.style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsv2hex(h,1,1)})`;
  const d=sv.querySelector('i');d.style.left=s*100+'%';d.style.top=(1-v)*100+'%';d.style.background=cur;
  const t=hue.querySelector('i');t.style.left=`calc(var(--hueh) / 2 + 1px + ${h/360} * (100% - var(--hueh) - 2px))`;t.style.background=hsv2hex(h,1,1);
  q('.am-hex > s').style.backgroundColor=cur;if(document.activeElement!==inp)inp.value=cur.slice(1);
  rec.querySelectorAll('.am-s').forEach((b,i)=>{const c=recent[i];b.classList.toggle('x',!c);b.dataset.c=c||'';b.style.setProperty('--sw',c||'transparent');b.setAttribute('aria-pressed',String(!!c&&c===cur));b.setAttribute('aria-label',c?'Use '+c:'Empty')});
  requestAnimationFrame(()=>measure());
  sav.querySelectorAll(':scope > .am-s').forEach((b,i)=>{const c=saved[i];b.classList.toggle('f',!!c);b.classList.toggle('e',!c);if(c){b.style.setProperty('--sw',c);b.style.setProperty('--on-sw',onInk(c))}b.setAttribute('aria-pressed',String(!!c&&c===cur));b.setAttribute('aria-label',c?'Saved '+c:'Save '+cur+' here');const [u,r]=b.querySelectorAll('.am-h i');u.setAttribute('aria-label','Use '+(c||''));r.setAttribute('aria-label','Replace with '+cur)});
}
const measure=()=>{const f=sav.querySelector(':scope > .am-s');if(!f)return;const w=f.getBoundingClientRect().width+'px';if(sav.style.getPropertyValue('--sww')===w)return;R.classList.add('am-notr');sav.style.setProperty('--sww',w);getComputedStyle(sav).width;requestAnimationFrame(()=>requestAnimationFrame(()=>R.classList.remove('am-notr')))};
new ResizeObserver(measure).observe(sav);document.fonts.ready.then(measure);
const push=c=>{recent=[c,...recent.filter(x=>x!==c)].slice(0,42)};
const set=(c,recd)=>{cur=c;[h,s,v]=hex2hsv(c);if(recd)push(c);paint()};
const drag=(el,fn)=>el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);fn(e);const mv=ev=>fn(ev);el.addEventListener('pointermove',mv);el.addEventListener('pointerup',()=>{el.removeEventListener('pointermove',mv);push(cur);paint()},{once:true})});
const cl=x=>Math.min(1,Math.max(0,x));
drag(sv,e=>{const r=sv.getBoundingClientRect();s=cl((e.clientX-r.left)/r.width);v=1-cl((e.clientY-r.top)/r.height);cur=hsv2hex(h,s,v);paint()});
drag(hue,e=>{const r=hue.getBoundingClientRect(),k=r.height+2;h=Math.min(359.9,cl((e.clientX-r.left-k/2)/(r.width-k))*360);cur=hsv2hex(h,s,v);paint()});
inp.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData.getData('text')||'').trim().replace(/^#/,'').slice(0,6);inp.value=t;if(/^[0-9a-f]{6}$/i.test(t))set('#'+t.toUpperCase(),true)});
inp.addEventListener('input',()=>{inp.value=inp.value.replace(/#/g,'');if(/^[0-9a-f]{6}$/i.test(inp.value))set('#'+inp.value.toUpperCase(),true)});
q('.am-cp').addEventListener('click',e=>{e.preventDefault();navigator.clipboard?.writeText(cur).catch(()=>{});const b=q('.am-cp');b.classList.add('ok');b.innerHTML=ICON('i-check');setTimeout(()=>{b.classList.remove('ok');b.innerHTML=ICON('i-copy')},1100)});
q('.am-new').addEventListener('click',()=>set(rnd(),true));
R.addEventListener('click',e=>{const a=e.target.closest('[data-a]'),b=e.target.closest('.am-s');if(!b||b.classList.contains('x'))return;
  if(b.closest('.am-rec')){if(b.dataset.c)set(b.dataset.c,false);return}
  const i=+b.dataset.i;
  if(b.classList.contains('e')){saved[i]=cur;paint();return}
  if(a){if(a.dataset.a==='use')set(saved[i],false);else{saved[i]=cur;paint()}}});
const chip=(row,k,c)=>{const el=q('.am-'+row+'hint [data-k='+k+']');if(!c){el.classList.remove('on');return}el.style.setProperty('--hc',c);el.querySelector('b').textContent=c;el.classList.add('on')};
rec.closest('.am-g').querySelector('.am-hint').classList.add('am-rechint');sav.closest('.am-g').querySelector('.am-hint').classList.add('am-savhint');
rec.addEventListener('mouseover',e=>{const b=e.target.closest('.am-s');chip('rec','use',b&&b.dataset.c||null)});
rec.addEventListener('mouseleave',()=>chip('rec','use',null));
sav.addEventListener('mouseover',e=>{const a=e.target.closest('[data-a]');sav.querySelectorAll('.am-h').forEach(h=>{h.dataset.hv=a&&h.contains(a)?a.dataset.a:''});const b=e.target.closest('.am-s.f');const c=b?saved[+b.dataset.i]:null;chip('sav','use',c);chip('sav','rep',c?cur:null)});
const closeDur=()=>{const v=getComputedStyle(R).getPropertyValue('--dc').trim();return (v.endsWith('ms')?parseFloat(v):parseFloat(v)*1000)+80};
const shut=o=>{if(!o)return;o.classList.remove('open');o.classList.add('closing');clearTimeout(o._ct);o._ct=setTimeout(()=>o.classList.remove('closing'),closeDur())};
sav.addEventListener('mouseleave',()=>{shut(sav.querySelector('.open'));sav.querySelectorAll('.am-h').forEach(h=>h.dataset.hv='');chip('sav','use',null);chip('sav','rep',null)});
sav.addEventListener('mouseover',e=>{const f=e.target.closest('.am-s');const o=sav.querySelector('.open');if(o&&o!==f&&!o.contains(e.target))shut(o);if(f&&f.classList.contains('f')&&!f.classList.contains('open')){clearTimeout(f._ct);f.classList.remove('closing');f.classList.add('open')}});
const K=[
 ['col','Form column','px',420,640,486],['pad','Block padding','px',8,24,14],['brad','Block corners','px',4,16,10],
 ['pw','Picker width','px',120,260,200],['svh','Picker height','px',90,220,137],['cg','Picker to controls gap','px',8,28,16],
 ['hueh','Hue bar height','px',6,20,12],['huer','Hue row height','px',12,56,44],['hueg','Square to hex gap','px',6,20,14],['rg','Group spacing','px',8,24,14],['bgap','Swatches to hue/hex row (layouts 1, 2)','px',4,40,14],
 ['fh','Field height','px',32,48,44],['frad','Field corners','px',4,14,9],['lg','Label to swatches gap','px',4,16,8],
 ['swg','Swatch gap','px',2,12,6],['swr','Swatch corners','px',2,14,6],
 ['cols','Swatches per row','',6,14,8],['nrec','Recent rows','',1,3,2],['gw','Saved hover width','×',150,300,200],['pop','Hovered half pop','px',0,8,3],['d3','Hover open speed','ms',120,600,300],['dc','Hover close speed','ms',150,900,340]];
const S=[['lay','Layout',[['left','Picker left, hue right'],['split','1 · Hue under picker, hex under swatches'],['stack','2 · Picker on top, hue + hex inline'],['right','Picker right'],['top','Picker top (old)']]],['lbl','Group labels',['on','off']],['div','Divider above Saved',['off','on']],['newlbl','New colour label',['on','off']],['hash','# prefix',['on','off']]];
const tk=document.getElementById('tk'),pre=document.getElementById('tk-pre');
const val={};
tk.innerHTML=K.map(([k,l,u,mn,mx,d])=>`<label>${l}<output id="o-${k}">${k==='gw'?(d/100).toFixed(2):d}${u}</output><input type="range" min="${mn}" max="${mx}" step="1" value="${d}" data-k="${k}" data-u="${u}"></label>`).join('')+S.map(([k,l,o])=>`<label>${l}<select data-s="${k}">${o.map(x=>Array.isArray(x)?`<option value="${x[0]}">${x[1]}</option>`:`<option>${x}</option>`).join('')}</select></label>`).join('');
const dump=()=>requestAnimationFrame(()=>{const hb=q('.am-hex').getBoundingClientRect().bottom,sb=[...sav.children].pop().getBoundingClientRect().bottom,dl=Math.round((hb-sb)*10)/10;pre.textContent=Object.entries(val).map(([k,x])=>`${k}: ${x}`).join('\n')+(R.dataset.lay==='left'?`\n\nflush (hex bottom − swatches bottom): ${dl>0?'+':''}${dl}px`:R.dataset.lay==='split'?(()=>{const d2=Math.round((sv.getBoundingClientRect().bottom-sb)*10)/10;return `\n\nflush (picker bottom − swatches bottom): ${d2>0?'+':''}${d2}px`})():'')});
const onChange=e=>{const t=e.target;
  if(t.dataset.k){const k=t.dataset.k,x=+t.value;document.getElementById('o-'+k).textContent=x+t.dataset.u;val[k]=x+t.dataset.u;
    if(k==='cols')cols=x;else if(k==='nrec')nrec=x;else if(k==='gw'){R.style.setProperty('--gw',x/100);document.getElementById('o-gw').textContent=(x/100).toFixed(2)+'×';val.gw=(x/100).toFixed(2)+'×'}else if(k==='d3'||k==='dc')R.style.setProperty('--'+k,x+'ms');else R.style.setProperty('--'+k,x+'px');paint()}
  if(t.dataset.s){R.dataset[t.dataset.s]=t.value;val[t.dataset.s]=t.value}
  dump()};
tk.addEventListener('input',onChange);tk.addEventListener('change',onChange);
K.forEach(([k,,u,,,d])=>val[k]=k==='gw'?(d/100).toFixed(2)+u:d+u);S.forEach(([k,,o])=>val[k]=Array.isArray(o[0])?o[0][0]:o[0]);dump();
document.getElementById('tk-copy').addEventListener('click',()=>{navigator.clipboard?.writeText(pre.textContent).catch(()=>{});const b=document.getElementById('tk-copy');b.textContent='Copied';setTimeout(()=>b.textContent='Copy values',1100)});
paint();measure();
})();
</script>
